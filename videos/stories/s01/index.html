<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url(/usr/share/fonts/opentype/inter/Inter-Bold.otf);font-weight:700}
@font-face{font-family:Inter;src:url(/usr/share/fonts/opentype/inter/Inter-SemiBold.otf);font-weight:600}
@font-face{font-family:Play;src:url(fonts/Playfair.ttf);font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#FAF9F6}
#st{position:absolute;inset:0;overflow:hidden;font-family:Inter}
.blob{position:absolute;border-radius:50%;filter:blur(120px);opacity:.55}
#tag{position:absolute;top:300px;width:100%;text-align:center}
#pill{display:inline-block;padding:16px 34px;border-radius:40px;background:#161513;color:#FAF9F6;font:600 32px Inter;letter-spacing:6px}
#pill b{color:#E2B56B}
#title{position:absolute;top:400px;width:100%;text-align:center;font:800 92px/100px Play;color:#161513}
#title i{font-style:normal;color:#C48C34}
#piece{position:absolute;left:0;top:640px;width:1080px;height:640px}
#cap{position:absolute;left:90px;right:90px;top:1220px;text-align:center;font:700 62px/80px Inter;color:#161513;perspective:900px}
#cap span{display:inline-block;margin:0 8px;transform-origin:50% 100%}
#cap span.hl{color:#C48C34}
#cta{position:absolute;top:1470px;width:100%;display:flex;flex-direction:column;align-items:center;gap:18px}
#zone{width:520px;height:120px;border:4px dashed #C48C34;border-radius:30px;display:flex;align-items:center;justify-content:center;font:700 40px Inter;color:#C48C34;background:rgba(255,255,255,.7)}
canvas{position:absolute;inset:0}
</style></head><body><div id="st">
<div class="blob" id="b1" style="width:900px;height:900px;background:#F1D7A8"></div>
<div class="blob" id="b2" style="width:800px;height:800px;background:#E3E6EE"></div>
<div id="tag"><span id="pill">NOVO REELS · <b>PESQUISA</b></span></div>
<div id="title"><i>3 perguntas</i><br>antes do produto</div>
<svg id="piece" viewBox="-540 -60 1080 640" style="overflow:visible"><ellipse id="shadow" cx="0" cy="470" rx="230" ry="36" fill="rgba(90,60,20,.18)"/><g id="box"><path d="M-180 200 L0 255 V445 L-180 390Z" fill="hsl(35,52%,50%)"/><path d="M180 200 L0 255 V445 L180 390Z" fill="hsl(33,50%,38%)"/><path id="lidb" d="M0 145 L180 200 L0 255 L-180 200Z" fill="hsl(36,40%,28%)"/><g id="lid"><path d="M0 145 L180 200 L0 255 L-180 200Z" fill="hsl(38,62%,72%)"/><path d="M-180 200 L0 255 V270 L-180 215Z" fill="hsl(36,55%,60%)"/><path d="M180 200 L0 255 V270 L180 215Z" fill="hsl(34,50%,48%)"/></g><g id="badge" transform="translate(0 340)"><g id="bdi"><circle r="62" fill="#161513"/><text id="qm" y="26" text-anchor="middle" font-family="Play" font-weight="800" font-size="80" fill="#E2B56B">?</text><path id="ck" d="M-28 2 L-8 24 L30 -22" stroke="#E2B56B" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0"/></g></g></g><g id="orb"></g><g id="chips"></g></svg>
<div id="cap"></div>
<div id="cta"><svg id="arrow" width="90" height="90" viewBox="0 0 90 90"><path d="M45 10 V70 M20 48 L45 74 L70 48" stroke="#161513" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><div id="zone">cole o link do Reels aqui</div></div>
<canvas id="fx" width="1080" height="1920"></canvas>
</div><script>
const TL=__TIMELINE__,S=TL.segs,$=id=>document.getElementById(id);
const HL=[["produto","ninguém","comprou"],["três","perguntas","criar","promessa","formato","preço"],["toca","assiste","agora"]];
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),eo=x=>1-Math.pow(1-clamp(x),4);
const back=x=>{x=clamp(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function bounce(x){const n=7.5625,d=2.75;if(x<1/d)return n*x*x;if(x<2/d)return n*(x-=1.5/d)*x+.75;if(x<2.5/d)return n*(x-=2.25/d)*x+.9375;return n*(x-=2.625/d)*x+.984375}
const Q=["maior problema?","o que já tentou?","quanto investiria?"],CH=["promessa","formato","preço"];let ob="",chs="";Q.forEach((q,k)=>{ob+=`<g class="qb"><rect x="-170" y="-40" width="340" height="80" rx="40" fill="#FFFFFF" stroke="#C48C34" stroke-width="4"/><path d="M-60 36 L-80 66 L-30 38Z" fill="#FFFFFF" stroke="#C48C34" stroke-width="4" stroke-linejoin="round"/><rect x="-74" y="30" width="50" height="9" fill="#FFFFFF"/><text y="12" text-anchor="middle" font-family="Inter" font-weight="700" font-size="32" fill="#161513">${q}</text></g>`});CH.forEach((c,k)=>{chs+=`<g class="ch"><rect x="-115" y="-34" width="230" height="68" rx="34" fill="#161513"/><text y="12" text-anchor="middle" font-family="Inter" font-weight="700" font-size="32" fill="#E2B56B">${c}</text></g>`});$("orb").innerHTML=ob;$("chips").innerHTML=chs;
const CAP=$("cap");let cs=-1,sp=[];
function setCap(i){if(cs===i)return;cs=i;CAP.innerHTML="";sp=[];let wi=0;S[i].text.replace("...","…").split(" ").forEach(tok=>{const e=document.createElement("span");e.textContent=tok;const c=tok.toLowerCase().replace(/[.,:?…!]/g,"");if(HL[i].includes(c))e.className="hl";e._t=S[i].wt[Math.min(wi,S[i].wt.length-1)];if(c)wi++;CAP.appendChild(e);sp.push(e)})}
const fx=$("fx").getContext("2d");
function render(t){
 $("b1").style.transform=`translate(${-260+140*Math.sin(t*.5)}px,${200+120*Math.cos(t*.4)}px)`;$("b2").style.transform=`translate(${520+120*Math.cos(t*.45)}px,${1150+140*Math.sin(t*.33)}px)`;
 const t0=S[0].start,t1=S[1].start,t2=S[2].start;
 $("pill").style.transform=`scale(${back((t-0.1)/0.5)})`;$("title").style.opacity=eo((t-0.3)/0.5);$("title").style.transform=`translateY(${(1-eo((t-0.3)/0.5))*30}px)`;
 // the one piece: empty box with "?" while 3 question bubbles orbit -> bubbles drop in -> "?" flips to check -> 3 answer chips pop out -> float
 const ib=back((t-0.15)/0.6);$("box").setAttribute("transform",`translate(0 ${(1-ib)*60}) scale(${Math.max(.01,ib)})`);$("box").style.transformOrigin="0 300px";
 const lidOpen=eo((t-0.6)/0.6)*(1-eo((t-(t1+2.9))/0.4));$("lid").setAttribute("transform",`translate(${-lidOpen*40} ${-lidOpen*120}) rotate(${-lidOpen*14})`);
 [...$("orb").children].forEach((g,k)=>{const ap=back((t-0.4-k*0.25)/0.5);const ang=t*1.3+k*2.094;let x=Math.cos(ang)*320,y=120+Math.sin(ang)*80;const sc=0.85+0.15*Math.sin(ang);
  const dt=t1+0.7+k*0.7,dp=clamp((t-dt)/0.6),de=eo(dp);x=x*(1-de);y=y*(1-de)+170*de;const s=Math.max(.01,ap*sc*(1-de*0.9));
  g.setAttribute("transform",`translate(${x} ${y}) scale(${s})`);g.style.opacity=dp>=1?0:1;
  $("orb").insertBefore?0:0});
 const fl=clamp((t-(t1+3.0))/0.5);const sx=Math.cos(fl*Math.PI);$("bdi").setAttribute("transform",`scale(${Math.abs(sx)+.001} 1) scale(${1+0.25*Math.sin(clamp(fl)*Math.PI)})`);$("qm").style.opacity=fl<.5?1:0;$("ck").style.opacity=fl<.5?0:1;$("qm").setAttribute("transform",`rotate(${fl<.5?Math.sin(t*4)*10:0})`);
 [...$("chips").children].forEach((g,k)=>{const cp=back((t-(t1+3.5)-k*0.25)/0.6);const tx=(k-1)*250,ty=50+Math.sin(t*2+k)*6;g.setAttribute("transform",`translate(${tx*clamp(cp)} ${200+(ty-200)*cp}) scale(${Math.max(.01,clamp(cp,0,1.2))})`);g.style.opacity=cp>0?1:0});
 const set=eo((t-(t1+3.6))/1);const fly=Math.sin(t*1.6)*12*set;$("piece").style.transform=`translateY(${fly}px) rotate(${Math.sin(t*.8)*1.5*set}deg)`;
 // CTA
 const ca=eo((t-t2+0.2)/0.5);$("cta").style.opacity=ca;$("arrow").style.transform=`translateY(${Math.abs(Math.sin(t*5))*18}px)`;
 $("zone").style.transform=`scale(${1+0.04*Math.sin(t*6)*ca})`;
 let i=t>=t2-0.3?2:t>=t1-0.3?1:0;setCap(i);sp.forEach(e=>{const a=eo((t-e._t+.06)/.3);e.style.opacity=a;e.style.transform=`translateY(${(1-a)*26}px) rotateX(${(1-a)*-80}deg)`});
 // sparkle burst when the check appears
 fx.clearRect(0,0,1080,1920);const lt=t-(t1+3.25);if(lt>0&&lt<0.8){for(let n=0;n<24;n++){const a=n/24*Math.PI*2,d=70+lt*280;fx.globalAlpha=1-lt/0.8;fx.fillStyle=n%2?"#C48C34":"#161513";fx.fillRect(540+Math.cos(a)*d-4,1040+Math.sin(a)*d-4,8,8)}fx.globalAlpha=1}
}
window.render=render;window.TOTAL=TL.total;render(0);
</script></body></html>
