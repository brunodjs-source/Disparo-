<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url(/usr/share/fonts/opentype/inter/Inter-Bold.otf);font-weight:700}
@font-face{font-family:Inter;src:url(/usr/share/fonts/opentype/inter/Inter-SemiBold.otf);font-weight:600}
@font-face{font-family:Play;src:url(fonts/Playfair.ttf);font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#FAF9F6}
#st{position:absolute;inset:0;overflow:hidden;font-family:Inter}
.blob{position:absolute;border-radius:50%;filter:blur(120px);opacity:.55}
#tag{position:absolute;top:300px;width:100%;text-align:center}
#pill{display:inline-block;padding:16px 34px;border-radius:40px;background:#161513;color:#FAF9F6;font:600 32px Inter;letter-spacing:6px}
#pill b{color:#E2B56B}
#title{position:absolute;top:400px;width:100%;text-align:center;font:800 92px/100px Play;color:#161513}
#title i{font-style:normal;color:#C48C34}
#piece{position:absolute;left:0;top:600px;width:1080px;height:640px}
#cap{position:absolute;left:90px;right:90px;top:1220px;text-align:center;font:700 62px/80px Inter;color:#161513;perspective:900px}
#cap span{display:inline-block;margin:0 8px;transform-origin:50% 100%}
#cap span.hl{color:#C48C34}
#cta{position:absolute;top:1470px;width:100%;display:flex;flex-direction:column;align-items:center;gap:18px}
#zone{width:520px;height:120px;border:4px dashed #C48C34;border-radius:30px;display:flex;align-items:center;justify-content:center;font:700 40px Inter;color:#C48C34;background:rgba(255,255,255,.7)}
canvas{position:absolute;inset:0}
</style></head><body><div id="st">
<div class="blob" id="b1" style="width:900px;height:900px;background:#F1D7A8"></div>
<div class="blob" id="b2" style="width:800px;height:800px;background:#E3E6EE"></div>
<div id="tag"><span id="pill">NOVO REELS · <b>PERPÉTUO</b></span></div>
<div id="title">Do lançamento<br>ao <i>perpétuo</i></div>
<svg id="piece" viewBox="-540 -60 1080 640" style="overflow:visible"><ellipse id="shadow" cx="0" cy="430" rx="260" ry="30" fill="rgba(90,60,20,.16)"/>
<path id="inf" fill="none" stroke="#C48C34" stroke-width="14" stroke-linecap="round" opacity=".85"/>
<g id="gears"></g><g id="coins"></g>
<g id="bar"><rect x="-320" y="470" width="640" height="54" rx="27" fill="#E9E3D8"/><rect id="barf" x="-320" y="470" width="0" height="54" rx="27" fill="#C48C34"/><text id="barl" x="0" y="512" text-anchor="middle" font-family="Inter" font-weight="700" font-size="36" fill="#161513">R$ 0</text></g></svg>
<div id="cap"></div>
<div id="cta"><svg id="arrow" width="90" height="90" viewBox="0 0 90 90"><path d="M45 10 V70 M20 48 L45 74 L70 48" stroke="#161513" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><div id="zone">cole o link do Reels aqui</div></div>
<canvas id="fx" width="1080" height="1920"></canvas>
</div><script>
const TL=__TIMELINE__,S=TL.segs,$=id=>document.getElementById(id);
const HL=[["zero"],["três","coisas","venda","todo","mês"],["toca","assiste","agora"]];
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),eo=x=>1-Math.pow(1-clamp(x),4);
const back=x=>{x=clamp(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function bounce(x){const n=7.5625,d=2.75;if(x<1/d)return n*x*x;if(x<2/d)return n*(x-=1.5/d)*x+.75;if(x<2.5/d)return n*(x-=2.25/d)*x+.9375;return n*(x-=2.625/d)*x+.984375}
const NS="http://www.w3.org/2000/svg";
function gear(r,n){let d="";for(let k=0;k<n;k++){const a=k/n*Math.PI*2,w=Math.PI/n;const pts=[[r-8,a-w*.55],[r+16,a-w*.3],[r+16,a+w*.3],[r-8,a+w*.55]];pts.forEach((p,q)=>d+=(k==0&&q==0?"M":"L")+(p[0]*Math.cos(p[1])).toFixed(1)+" "+(p[0]*Math.sin(p[1])).toFixed(1));}return d+"Z"}
const GE=[[0,220,110,14,"#C48C34",1],[-188,140,78,10,"#E2B56B",-1.4],[188,300,78,10,"#A8742A",-1.4]];
const GS=[[-420,-80],[420,-60],[0,-300]];
$("gears").innerHTML=GE.map(([x,y,r,n,c])=>`<g class="g"><g><path d="${gear(r,n)}" fill="${c}" stroke="#161513" stroke-width="4"/><circle r="${r*.45}" fill="#FAF9F6" stroke="#161513" stroke-width="4"/><circle r="${r*.16}" fill="#161513"/></g></g>`).join("");
let ch="";for(let k=0;k<7;k++)ch+=`<g class="coin"><circle r="26" fill="#E2B56B" stroke="#A8742A" stroke-width="5"/><text y="10" text-anchor="middle" font-family="Play" font-weight="800" font-size="28" fill="#7A5218">$</text></g>`;$("coins").innerHTML=ch;
const LP=s=>{const d=1+Math.sin(s)**2;return[440*Math.cos(s)/d,220+440*Math.sin(s)*Math.cos(s)/d*1.05]};
let ip="";for(let k=0;k<=200;k++){const p=LP(k/200*Math.PI*2);ip+=(k?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)}$("inf").setAttribute("d",ip);const IL=$("inf").getTotalLength();$("inf").style.strokeDasharray=IL;
const CAP=$("cap");let cs=-1,sp=[];
function setCap(i){if(cs===i)return;cs=i;CAP.innerHTML="";sp=[];let wi=0;S[i].text.replace("...","…").split(" ").forEach(tok=>{const e=document.createElement("span");e.textContent=tok;const c=tok.toLowerCase().replace(/[.,:?…!]/g,"");if(HL[i].includes(c))e.className="hl";e._t=S[i].wt[Math.min(wi,S[i].wt.length-1)];if(c)wi++;CAP.appendChild(e);sp.push(e)})}
const fx=$("fx").getContext("2d");
function render(t){
 $("b1").style.transform=`translate(${-260+140*Math.sin(t*.5)}px,${200+120*Math.cos(t*.4)}px)`;$("b2").style.transform=`translate(${520+120*Math.cos(t*.45)}px,${1150+140*Math.sin(t*.33)}px)`;
 const t0=S[0].start,t1=S[1].start,t2=S[2].start;
 $("pill").style.transform=`scale(${back((t-0.1)/0.5)})`;$("title").style.opacity=eo((t-0.3)/0.5);$("title").style.transform=`translateY(${(1-eo((t-0.3)/0.5))*30}px)`;
 // revenue bar resets to zero (seg0) -> gears lock in, turn, infinity forms, coins flow (seg1) -> float
 const lock=t1+1.9;let fill,lab;
 if(t<lock){const c=((t-0.3)%1.15)/1.15;fill=t<0.3?0:(c<0.8?eo(c/0.8)*0.62:0.62*(1-eo((c-0.8)/0.12)));lab="lançamento";if(c>0.85)lab="R$ 0"}
 else{fill=0.62*(1-eo((t-lock)/0.3))+eo((t-lock-0.6)/2.2)*(t>lock?1:0);fill=Math.min(1,fill);lab=t>lock+0.6?"venda todo mês":"R$ 0"}
 $("barf").setAttribute("width",Math.max(54,640*fill)*(fill>0.005?1:0));$("barl").textContent=lab;
 $("bar").setAttribute("transform",`translate(${t<lock&&fill<0.05&&t>0.6?Math.sin(t*60)*6:0} 0)`);
 const spin=t>lock?(t-lock)*1.4*eo((t-lock)/0.8):0;
 [...$("gears").children].forEach((g,k)=>{const [x,y]=GE[k],sp=GS[k];const e=bounce(clamp((t-(t1+0.3+k*0.45))/0.7));const sh=t>lock&&t<lock+0.25?Math.sin((t-lock)*80)*4:0;
  g.setAttribute("transform",`translate(${x+sp[0]*(1-e)+sh} ${y+sp[1]*(1-e)}) scale(${Math.max(.01,clamp((t-(t1+0.3+k*0.45))/0.25))})`);
  g.firstChild.setAttribute("transform",`rotate(${(k==0?0:180/GE[k][3])+spin*57.3*GE[k][5]})`)});
 $("inf").style.strokeDashoffset=IL*(1-eo((t-(lock+0.2))/1.3));
 [...$("coins").children].forEach((c,k)=>{const a=clamp((t-(lock+1.0+k*0.25))/0.4);const p=LP(-(t-lock)*0.9+k/7*Math.PI*2);c.setAttribute("transform",`translate(${p[0]} ${p[1]}) scale(${a*(0.9+0.1*Math.sin(t*4+k))}) rotate(${Math.sin(t*3+k)*20})`)});
 const order=eo((t-lock)/1);const fly=Math.sin(t*1.6)*12*order;$("piece").style.transform=`translateY(${fly}px) rotate(${Math.sin(t*.8)*1.5*order}deg)`;
 // CTA
 const ca=eo((t-t2+0.2)/0.5);$("cta").style.opacity=ca;$("arrow").style.transform=`translateY(${Math.abs(Math.sin(t*5))*18}px)`;
 $("zone").style.transform=`scale(${1+0.04*Math.sin(t*6)*ca})`;
 let i=t>=t2-0.3?2:t>=t1-0.3?1:0;setCap(i);sp.forEach(e=>{const a=eo((t-e._t+.06)/.3);e.style.opacity=a;e.style.transform=`translateY(${(1-a)*26}px) rotateX(${(1-a)*-80}deg)`});
 // sparkle burst when tag lands
 fx.clearRect(0,0,1080,1920);const lt=t-(t1+1.9);if(lt>0&&lt<0.8){for(let n=0;n<24;n++){const a=n/24*Math.PI*2,d=60+lt*260;fx.globalAlpha=1-lt/0.8;fx.fillStyle=n%2?"#C48C34":"#161513";fx.fillRect(540+Math.cos(a)*d-4,880+Math.sin(a)*d-4,8,8)}fx.globalAlpha=1}
}
window.render=render;window.TOTAL=TL.total;render(0);
</script></body></html>
