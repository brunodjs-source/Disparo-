<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url(/usr/share/fonts/opentype/inter/Inter-Bold.otf);font-weight:700}
@font-face{font-family:Inter;src:url(/usr/share/fonts/opentype/inter/Inter-SemiBold.otf);font-weight:600}
@font-face{font-family:Play;src:url(fonts/Playfair.ttf);font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#FAF9F6}
#st{position:absolute;inset:0;overflow:hidden;font-family:Inter}
.blob{position:absolute;border-radius:50%;filter:blur(120px);opacity:.55}
#tag{position:absolute;top:300px;width:100%;text-align:center}
#pill{display:inline-block;padding:16px 34px;border-radius:40px;background:#161513;color:#FAF9F6;font:600 32px Inter;letter-spacing:6px}
#pill b{color:#E2B56B}
#title{position:absolute;top:400px;width:100%;text-align:center;font:800 92px/100px Play;color:#161513}
#title i{font-style:normal;color:#C48C34}
#piece{position:absolute;left:0;top:600px;width:1080px;height:640px}
#cap{position:absolute;left:90px;right:90px;top:1220px;text-align:center;font:700 62px/80px Inter;color:#161513;perspective:900px}
#cap span{display:inline-block;margin:0 8px;transform-origin:50% 100%}
#cap span.hl{color:#C48C34}
#cta{position:absolute;top:1470px;width:100%;display:flex;flex-direction:column;align-items:center;gap:18px}
#zone{width:520px;height:120px;border:4px dashed #C48C34;border-radius:30px;display:flex;align-items:center;justify-content:center;font:700 40px Inter;color:#C48C34;background:rgba(255,255,255,.7)}
canvas{position:absolute;inset:0}
</style></head><body><div id="st">
<div class="blob" id="b1" style="width:900px;height:900px;background:#F1D7A8"></div>
<div class="blob" id="b2" style="width:800px;height:800px;background:#E3E6EE"></div>
<div id="tag"><span id="pill">NOVO REELS · <b>AQUECIMENTO</b></span></div>
<div id="title">Lead <i>frio</i><br>não aparece</div>
<svg id="piece" viewBox="-540 -60 1080 640" style="overflow:visible"><defs>
<linearGradient id="bg" x1="0" x2="1"><stop id="g0" offset="0"/><stop id="g1" offset=".45"/><stop id="g2" offset="1"/></linearGradient>
<radialGradient id="glo"><stop offset="0" stop-color="#F5C46A" stop-opacity=".75"/><stop offset="1" stop-color="#F5C46A" stop-opacity="0"/></radialGradient>
<linearGradient id="ig" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#F7B733"/><stop offset=".5" stop-color="#E1306C"/><stop offset="1" stop-color="#833AB4"/></linearGradient></defs>
<ellipse id="shadow" cx="0" cy="520" rx="200" ry="34" fill="rgba(90,60,20,.18)"/>
<circle id="glow" cx="0" cy="280" r="300" fill="url(#glo)"/>
<g id="therm"><rect x="398" y="190" width="44" height="300" rx="22" fill="#fff" stroke="#161513" stroke-width="5"/><rect id="merc" x="408" y="200" width="24" height="280" rx="12" fill="#C48C34"/><circle cx="420" cy="500" r="36" id="bulb" fill="#C48C34" stroke="#161513" stroke-width="5"/></g>
<g id="waves" fill="none" stroke="#C48C34" stroke-width="10" stroke-linecap="round"><path d="M-200 200 Q-240 260 -200 320"/><path d="M-245 170 Q-300 260 -245 350"/><path d="M200 200 Q240 260 200 320"/><path d="M245 170 Q300 260 245 350"/></g>
<g id="bell"><circle cx="0" cy="96" r="22" fill="url(#bg)" stroke="rgba(0,0,0,.15)" stroke-width="3"/>
<g id="clap"><circle cx="0" cy="430" r="34" fill="#3a332a"/></g>
<path d="M-150 400 C-150 330 -125 300 -125 230 C-125 150 -70 110 0 110 C70 110 125 150 125 230 C125 300 150 330 150 400Z" fill="url(#bg)"/>
<path d="M-80 170 C-100 210 -100 280 -95 330" stroke="rgba(255,255,255,.55)" stroke-width="16" fill="none" stroke-linecap="round"/>
<ellipse cx="0" cy="400" rx="168" ry="34" id="rim" fill="url(#bg)" stroke="rgba(0,0,0,.18)" stroke-width="4"/></g>
<g id="zz" font-family="Play" font-weight="800" fill="#8a8a8a"><text x="120" y="120" font-size="54">z</text><text x="170" y="60" font-size="70">z</text></g>
<g class="bd" data-x="-340" data-y="120"><circle r="72" fill="#161513"/><rect x="-38" y="-26" width="76" height="52" rx="6" fill="#FAF9F6"/><path d="M-38 -22 L0 8 L38 -22" stroke="#161513" stroke-width="6" fill="none"/></g>
<g class="bd" data-x="340" data-y="70"><circle r="72" fill="#25D366"/><path d="M0 -40 A40 40 0 1 1 -26 30 L-42 42 L-34 22 A40 40 0 0 1 0 -40Z" fill="#fff"/><path d="M-14 -14 Q-12 14 14 16" stroke="#25D366" stroke-width="9" fill="none" stroke-linecap="round"/></g>
<g class="bd" data-x="-350" data-y="390"><circle r="72" fill="url(#ig)"/><circle r="50" fill="none" stroke="#fff" stroke-width="7" stroke-dasharray="40 12"/><circle r="30" fill="#fff"/></g>
<g id="chk"><circle r="52" fill="#C48C34" stroke="#fff" stroke-width="6"/><path d="M-22 2 L-6 18 L24 -16" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
<div id="cap"></div>
<div id="cta"><svg id="arrow" width="90" height="90" viewBox="0 0 90 90"><path d="M45 10 V70 M20 48 L45 74 L70 48" stroke="#161513" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><div id="zone">cole o link do Reels aqui</div></div>
<canvas id="fx" width="1080" height="1920"></canvas>
</div><script>
const TL=__TIMELINE__,S=TL.segs,$=id=>document.getElementById(id);
const HL=[["esqueceu","inscreveu"],["quente","evento","motivo","lembrete","canal","tarefa"],["toca","assiste","agora"]];
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),eo=x=>1-Math.pow(1-clamp(x),4);
const back=x=>{x=clamp(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function bounce(x){const n=7.5625,d=2.75;if(x<1/d)return n*x*x;if(x<2/d)return n*(x-=1.5/d)*x+.75;if(x<2.5/d)return n*(x-=2.25/d)*x+.9375;return n*(x-=2.625/d)*x+.984375}
const CAP=$("cap");let cs=-1,sp=[];
function setCap(i){if(cs===i)return;cs=i;CAP.innerHTML="";sp=[];let wi=0;S[i].text.replace("...","…").split(" ").forEach(tok=>{const e=document.createElement("span");e.textContent=tok;const c=tok.toLowerCase().replace(/[.,:?…!]/g,"");if(HL[i].includes(c))e.className="hl";e._t=S[i].wt[Math.min(wi,S[i].wt.length-1)];if(c)wi++;CAP.appendChild(e);sp.push(e)})}
const fx=$("fx").getContext("2d");
function render(t){
 $("b1").style.transform=`translate(${-260+140*Math.sin(t*.5)}px,${200+120*Math.cos(t*.4)}px)`;$("b2").style.transform=`translate(${520+120*Math.cos(t*.45)}px,${1150+140*Math.sin(t*.33)}px)`;
 const t0=S[0].start,t1=S[1].start,t2=S[2].start;
 $("pill").style.transform=`scale(${back((t-0.1)/0.5)})`;$("title").style.opacity=eo((t-0.3)/0.5);$("title").style.transform=`translateY(${(1-eo((t-0.3)/0.5))*30}px)`;
const mix=(a,b,k)=>"rgb("+a.map((v,i)=>Math.round(v+(b[i]-v)*k)).join(",")+")";
 const ring=clamp((t-(t1+0.5))/1.0),w=eo((t-(t1+0.6))/4.6);
 $("g0").setAttribute("stop-color",mix([120,124,130],[170,110,30],w));$("g1").setAttribute("stop-color",mix([200,203,208],[250,210,120],w));$("g2").setAttribute("stop-color",mix([110,114,120],[160,100,25],w));
 const intro=back((t-0.15)/0.6),amp=ring*(1-0.75*clamp((t-(t1+5.2))/1.5));
 const sw=Math.sin(t*14)*16*amp;
 $("bell").setAttribute("transform",`translate(0 ${(1-intro)*-300}) rotate(${sw-(1-ring)*6} 0 96)`);$("clap").setAttribute("transform",`translate(${-sw*3} 0)`);
 $("waves").style.opacity=amp*(0.5+0.5*Math.sin(t*14));$("zz").style.opacity=(1-ring)*eo((t-0.8)/0.4);$("zz").setAttribute("transform",`translate(0 ${-((t*30)%40)})`);
 $("glow").style.opacity=w;$("glow").setAttribute("r",180+160*w);
 $("merc").setAttribute("y",480-280*(0.08+0.92*w));$("merc").setAttribute("height",280*(0.08+0.92*w));$("merc").style.fill=$("bulb").style.fill=mix([150,170,200],[196,140,52],w);
 [...document.querySelectorAll(".bd")].forEach((g,k)=>{const p=back((t-(t1+3.0+k*0.75))/0.5);const x=+g.dataset.x,y=+g.dataset.y;g.setAttribute("transform",`translate(${x*p} ${260+(y-260)*p+Math.sin(t*2+k)*8*p}) scale(${Math.max(.001,p)})`);g.style.opacity=p>0.01?1:0});
 const cp=back((t-(t1+5.6))/0.5);$("chk").setAttribute("transform",`translate(110 380) scale(${Math.max(.001,cp)})`);$("chk").style.opacity=cp>0.01?1:0;
 const order=clamp((t-t1-6)/1);const fly=Math.sin(t*1.6)*12*order;$("piece").style.transform=`translateY(${fly}px) rotate(${Math.sin(t*.8)*1.5*order}deg)`;
 // CTA
 const ca=eo((t-t2+0.2)/0.5);$("cta").style.opacity=ca;$("arrow").style.transform=`translateY(${Math.abs(Math.sin(t*5))*18}px)`;
 $("zone").style.transform=`scale(${1+0.04*Math.sin(t*6)*ca})`;
 let i=t>=t2-0.3?2:t>=t1-0.3?1:0;setCap(i);sp.forEach(e=>{const a=eo((t-e._t+.06)/.3);e.style.opacity=a;e.style.transform=`translateY(${(1-a)*26}px) rotateX(${(1-a)*-80}deg)`});
 // sparkle burst when tag lands
 fx.clearRect(0,0,1080,1920);const lt=t-(t1+5.7);if(lt>0&&lt<0.8){for(let n=0;n<24;n++){const a=n/24*Math.PI*2,d=60+lt*260;fx.globalAlpha=1-lt/0.8;fx.fillStyle=n%2?"#C48C34":"#161513";fx.fillRect(540+Math.cos(a)*d-4,920+Math.sin(a)*d-4,8,8)}fx.globalAlpha=1}
}
window.render=render;window.TOTAL=TL.total;render(0);
</script></body></html>
