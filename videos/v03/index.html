<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;src:url(/usr/share/fonts/opentype/inter/Inter-Bold.otf);font-weight:700}
@font-face{font-family:Inter;src:url(/usr/share/fonts/opentype/inter/Inter-SemiBold.otf);font-weight:600}
@font-face{font-family:Play;src:url(fonts/Playfair.ttf);font-weight:100 900}
:root{--bg:#FAF9F6;--txt:#161513;--gold:#C48C34;--goldD:#7A4E18;--dim:#8C867C;--line:#E4DED2}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--bg);font-family:Inter}
.blob{position:absolute;border-radius:50%;filter:blur(110px);opacity:.55}
#label{position:absolute;top:280px;width:100%;text-align:center;font:600 34px Inter;letter-spacing:9px;color:var(--gold)}
#label:after{content:"";display:block;width:80px;height:2px;background:var(--gold);margin:22px auto 0}
#cam{position:absolute;inset:0;transform-origin:50% 40%}
#illus{position:absolute;left:0;top:380px;width:1080px;height:420px;perspective:1400px}
.sc{position:absolute;inset:0;transform-style:preserve-3d;display:flex;align-items:center;justify-content:center;opacity:0}
#cap{position:absolute;left:90px;right:90px;top:920px;text-align:center;font:700 72px/92px Inter;color:var(--txt);perspective:900px}
#cap span{display:inline-block;margin:0 9px;transform-origin:50% 100%;will-change:transform}
#cap span.hl{color:var(--gold);text-shadow:1px 1px 0 #d9a85a,2px 2px 0 #c99a4e,3px 3px 0 #b8893f,5px 8px 12px rgba(90,60,20,.18)}
canvas{position:absolute;inset:0}
/* 3D box */
.box{position:relative;width:200px;height:200px;transform-style:preserve-3d}
.box .f{position:absolute;width:200px;height:200px;border-radius:14px}
.part{position:absolute;width:150px;height:56px;transform-style:preserve-3d}
.part .t,.part .fr,.part .sd{position:absolute;border-radius:6px}
.chip{width:58px;height:58px;border-radius:50%;border:3px solid var(--line);background:#fff;font:700 28px Inter;color:var(--dim);display:flex;align-items:center;justify-content:center}
.chip.on{border-color:var(--gold);background:var(--gold);color:#fff;box-shadow:0 8px 20px rgba(196,140,52,.35)}
#chips{position:absolute;top:815px;width:100%;display:flex;gap:26px;justify-content:center;opacity:0}
.big3d{font:800 150px Play;color:var(--gold);text-shadow:1px 1px 0 #b07a28,2px 2px 0 #a8742a,3px 3px 0 #9c6a22,4px 4px 0 #925f1e,5px 5px 0 #8a5c1c,6px 6px 0 #835619,7px 7px 0 #7a4e18,8px 8px 0 #704615,14px 22px 26px rgba(90,60,20,.3)}
.pill{height:64px;padding:0 30px;border-radius:32px;border:3px solid var(--line);background:#fff;font:700 30px Inter;color:var(--dim);display:flex;align-items:center;gap:12px}
.pill.on{border-color:var(--gold);background:var(--gold);color:#fff;box-shadow:0 8px 20px rgba(196,140,52,.35)}
.pill.done{border-color:var(--gold);color:var(--goldD)}
</style></head>
<body><div id="stage">
<div class="blob" id="b1" style="width:900px;height:900px;background:#F1D7A8"></div>
<div class="blob" id="b2" style="width:800px;height:800px;background:#E3E6EE"></div>
<div id="cam">
<div id="label">ETAPA 3 · CAPTAÇÃO</div>
<div id="illus">
 <!-- 0 lead barato, ninguém compra: etiqueta R$0,90 brilha e racha -->
 <div class="sc" id="s0">
  <svg width="1080" height="420" viewBox="0 0 1080 420" style="overflow:visible">
   <defs><radialGradient id="glow"><stop offset="0" stop-color="#F4D59A" stop-opacity=".95"/><stop offset="1" stop-color="#F4D59A" stop-opacity="0"/></radialGradient></defs>
   <circle id="glw" cx="430" cy="210" r="260" fill="url(#glow)"/>
   <g id="ptag" transform="translate(430 210)">
    <g id="ptL"><path d="M-250 0 L-170 -110 H0 V110 H-170Z" fill="#C48C34"/><circle cx="-180" cy="0" r="18" fill="#FAF9F6"/></g>
    <g id="ptR"><path d="M0 -110 H170 Q190 -110 190 -90 V90 Q190 110 170 110 H0Z" fill="#B88232"/></g>
    <text id="ptx" x="-30" y="34" text-anchor="middle" font-family="Play" font-weight="800" font-size="88" fill="#fff">R$0,90</text>
    <path id="crk" d="M10 -112 L-20 -50 L25 -10 L-15 40 L20 112" fill="none" stroke="#161513" stroke-width="9" stroke-linejoin="round" stroke-dasharray="360" stroke-dashoffset="360"/>
   </g>
   <g id="ecart" transform="translate(840 250)">
    <path d="M-110 -90 L-80 -90 L-50 40 L90 40 L115 -50 L-70 -50" fill="none" stroke="#161513" stroke-width="13" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="-30" cy="78" r="22" fill="#161513"/><circle cx="72" cy="78" r="22" fill="#161513"/>

  <svg width="1080" height="420" viewBox="0 0 1080 420" style="overflow:visible">
   <line x1="140" y1="370" x2="960" y2="370" stroke="#E4DED2" stroke-width="6" stroke-linecap="round"/>
   <line x1="140" y1="30" x2="140" y2="370" stroke="#E4DED2" stroke-width="6" stroke-linecap="round"/>
   <line x1="140" y1="200" x2="960" y2="200" stroke="#E4DED2" stroke-width="3" stroke-dasharray="12 12"/>
   <path id="cplL" d="M150 300 C300 290 380 160 500 110 S700 60 760 70" fill="none" stroke="#C48C34" stroke-width="14" stroke-linecap="round" stroke-dasharray="900" stroke-dashoffset="900"/>
   <path id="lossL" d="M760 70 C800 90 820 250 900 340" fill="none" stroke="#C0392B" stroke-width="14" stroke-linecap="round" stroke-dasharray="320" stroke-dashoffset="320"/>
   <g id="cplB" transform="translate(500 40)"><rect x="-120" y="-34" width="240" height="64" rx="32" fill="#fff" stroke="#C48C34" stroke-width="4"/><text y="12" text-anchor="middle" font-family="Inter" font-weight="700" font-size="32" fill="#7A4E18">CPL ótimo ✓</text></g>
   <g id="lossB" transform="translate(900 340)"><circle r="44" fill="#C0392B"/><path d="M0 -22 V18 M-16 4 L0 20 L16 4" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text y="-64" text-anchor="middle" font-family="Inter" font-weight="700" font-size="34" fill="#C0392B">−R$</text></g>
  </svg>
 </div>
 <!-- 2 lead barato = lead errado -->
 <div class="sc" id="s2">
  <svg width="1080" height="420" viewBox="0 0 1080 420" style="overflow:visible"><g id="crowd"></g></svg>
 </div>

 <div class="sc" id="s3">
  <svg width="1080" height="420" viewBox="0 0 1080 420" style="overflow:visible">
   <g id="gL" transform="translate(290 290)"></g>
   <g id="gR" transform="translate(780 290)"></g>
   <text id="vs" x="535" y="250" text-anchor="middle" font-family="Play" font-weight="800" font-size="56" fill="#8C867C">vs</text>
  </svg>
 </div>
 <!-- 4 três alavancas -->
 <div class="sc" id="s4">
  <svg width="1080" height="420" viewBox="0 0 1080 420" style="overflow:visible"><rect x="160" y="320" width="760" height="56" rx="18" fill="#161513"/><g id="levers"></g></svg>
 </div>
 <!-- 5 megafone mirando a pessoa certa -->
 <div class="sc" id="s5">
  <svg width="1080" height="420" viewBox="0 0 1080 420" style="overflow:visible">
   <g id="tgt" transform="translate(800 210)"><circle r="170" fill="#fff" stroke="#E4DED2" stroke-width="6"/><circle r="120" fill="none" stroke="#E8D9BC" stroke-width="22"/><circle r="64" fill="none" stroke="#E2B56B" stroke-width="22"/>
    <g id="tp"><circle cy="-30" r="34" fill="#161513"/><path d="M-58 70 Q-58 14 0 14 Q58 14 58 70Z" fill="#161513"/></g>
    <g id="tq" transform="translate(70 -90)"><circle r="28" fill="#C48C34"/><text y="12" text-anchor="middle" font-family="Inter" font-weight="700" font-size="36" fill="#fff">?</text></g></g>
   <g id="waves" fill="none" stroke="#C48C34" stroke-width="10" stroke-linecap="round"></g>
   <g id="mega" transform="translate(220 210)">
    <path d="M-60 -40 L80 -120 V120 L-60 40Z" fill="#C48C34"/><rect x="-110" y="-46" width="60" height="92" rx="14" fill="#161513"/>
    <ellipse cx="80" rx="22" ry="120" fill="#E2B56B"/><path d="M-80 46 L-60 120 H-20 L-30 46" fill="#7A4E18"/>
   </g>
  </svg>
 </div>
 <!-- 6 página rápida, uma promessa -->
 <div class="sc" id="s6">
  <svg width="1080" height="420" viewBox="0 0 1080 420" style="overflow:visible">
   <g transform="translate(250 0)">
    <rect x="0" y="0" width="580" height="400" rx="28" fill="#fff" stroke="#161513" stroke-width="8"/>
    <path d="M0 60 H580" stroke="#161513" stroke-width="6"/>
    <circle cx="36" cy="30" r="10" fill="#C0392B"/><circle cx="68" cy="30" r="10" fill="#E2B56B"/><circle cx="100" cy="30" r="10" fill="#8FB46B"/>
    <rect x="140" y="18" width="400" height="24" rx="12" fill="#EEE9DF"/><rect id="ldb" x="140" y="18" width="0" height="24" rx="12" fill="#C48C34"/>
    <g id="hdl"><rect x="60" y="110" width="460" height="56" rx="12" fill="#161513"/><text x="290" y="150" text-anchor="middle" font-family="Inter" font-weight="700" font-size="34" fill="#FAF9F6">UMA promessa</text></g>
    <g id="sub"><rect x="110" y="195" width="360" height="18" rx="9" fill="#E4DED2"/><rect x="150" y="228" width="280" height="18" rx="9" fill="#E4DED2"/></g>
    <g id="btn"><rect x="150" y="290" width="280" height="70" rx="35" fill="#C48C34"/><text x="290" y="336" text-anchor="middle" font-family="Inter" font-weight="700" font-size="30" fill="#fff">QUERO</text></g>
   </g>
   <g id="spd" transform="translate(930 90)"><circle r="70" fill="#161513"/><text id="spdt" y="14" text-anchor="middle" font-family="Inter" font-weight="700" font-size="38" fill="#E2B56B">0,0s</text></g>
   <g id="bolt" transform="translate(150 200)"><path d="M10 -90 L-40 10 H0 L-14 90 L44 -14 H4Z" fill="#C48C34"/></g>
  </svg>
 </div>
 <!-- 7 calendário 14 a 21 dias -->
 <div class="sc" id="s7">
  <svg width="1080" height="440" viewBox="0 0 1080 440" style="overflow:visible">
   <g transform="translate(250 0)">
    <rect x="0" y="0" width="580" height="420" rx="28" fill="#fff" stroke="#161513" stroke-width="8"/>
    <path d="M4 70 H576 V24 Q576 4 556 4 H24 Q4 4 4 24Z" fill="#C48C34"/>
    <rect x="110" y="-24" width="16" height="52" rx="8" fill="#161513"/><rect x="454" y="-24" width="16" height="52" rx="8" fill="#161513"/>
    <g id="cells"></g>
   </g>
   <g id="dcnt" transform="translate(130 210)"><text id="dct" text-anchor="middle" y="30" font-family="Play" font-weight="800" font-size="96" fill="#C48C34">0</text><text y="80" text-anchor="middle" font-family="Inter" font-weight="700" font-size="30" fill="#8C867C">dias</text></g>
  </svg>
 </div>
 <!-- 8 menos não aquece, mais esfria: curva + termômetro -->
 <div class="sc" id="s8">
  <svg width="1080" height="420" viewBox="0 0 1080 420" style="overflow:visible">
   <rect id="zone" x="420" y="20" width="240" height="340" rx="16" fill="#F4E3C2"/>
   <text x="540" y="60" text-anchor="middle" font-family="Inter" font-weight="700" font-size="28" fill="#7A4E18">14–21</text>
   <line x1="140" y1="360" x2="900" y2="360" stroke="#E4DED2" stroke-width="6" stroke-linecap="round"/>
   <path id="heat" d="M140 340 C300 330 380 120 540 110 S760 300 900 330" fill="none" stroke="#C48C34" stroke-width="12" stroke-linecap="round" stroke-dasharray="900" stroke-dashoffset="900"/>
   <circle id="hdot" r="20" fill="#161513" stroke="#fff" stroke-width="6"/>
   <text x="200" y="400" text-anchor="middle" font-family="Inter" font-weight="700" font-size="28" fill="#5B8DB8">frio</text>
   <text x="840" y="400" text-anchor="middle" font-family="Inter" font-weight="700" font-size="28" fill="#5B8DB8">esfriou</text>
   <g transform="translate(990 60)"><rect x="-22" y="0" width="44" height="260" rx="22" fill="#fff" stroke="#161513" stroke-width="6"/><circle cy="285" r="40" fill="#fff" stroke="#161513" stroke-width="6"/>
    <circle id="bulb" cy="285" r="30" fill="#5B8DB8"/><rect id="merc" x="-11" width="22" rx="11" fill="#5B8DB8"/></g>
  </svg>
 </div>
 <!-- 9 CTA -->
 <div class="sc" id="s9" style="flex-direction:column">
  <div class="big3d" id="ctaw">CAPTAÇÃO</div>
  <div id="cbox" style="margin-top:40px;width:860px;height:104px;border-radius:52px;background:#fff;border:3px solid var(--gold);box-shadow:4px 10px 0 #E4DED2;display:flex;align-items:center;padding:0 34px 0 50px;font:600 44px Inter;color:var(--txt)">
   <span id="ctxt"></span><span id="caret" style="width:4px;height:50px;background:var(--gold);margin-left:6px"></span>
   <span style="margin-left:auto;width:70px;height:70px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-size:40px">↑</span>
  </div>
 </div>
</div>
<div id="chips"></div>
<div id="cap"></div>
</div>
<canvas id="fx" width="1080" height="1920"></canvas>
</div>
<script>
const TL = __TIMELINE__;
const S = TL.segs, $ = id => document.getElementById(id);
const HL = [["barato","ninguém","compra"],["lindo","prejuízo"],["barato","errado"],["cliente","lead"],["três","coisas"],["anúncio","problema"],["página","rápido","só"],["captação","14","21"],["aquece","esfria"],["captação","checklist"]];
const SC = S.map(s => s.start - 0.35);
const clamp = (x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo = x => 1-Math.pow(1-clamp(x),4);
const eio = x => {x=clamp(x);return x<.5?8*x*x*x*x:1-Math.pow(-2*x+2,4)/2};
const back = x => {x=clamp(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const elastic = x => {x=clamp(x);return x===0?0:x===1?1:Math.pow(2,-10*x)*Math.sin((x*10-.75)*2*Math.PI/3)+1};
function rnd(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)}

// build static bits
let cr="";for(let k=0;k<7;k++){const x=150+k*130,good=k===4;cr+=`<g class="pp" data-g="${good?1:0}" transform="translate(${x} 250)"><g class="ppi"><circle cy="-60" r="38" class="ph"/><path d="M-56 60 Q-56 -8 0 -8 Q56 -8 56 60Z" class="pb"/><g class="mk" transform="translate(0 -150)"></g></g></g>`}$("crowd").innerHTML=cr;
function gauge(lbl,col){let g=`<path d="M-170 0 A170 170 0 0 1 170 0" fill="none" stroke="#EEE9DF" stroke-width="34" stroke-linecap="round"/>`;
 for(let k=0;k<=10;k++){const a=Math.PI*(1-k/10);g+=`<line x1="${Math.cos(a)*120}" y1="${-Math.sin(a)*120}" x2="${Math.cos(a)*138}" y2="${-Math.sin(a)*138}" stroke="#8C867C" stroke-width="${k%5?3:6}"/>`}
 g+=`<path class="arc" d="M-170 0 A170 170 0 0 1 170 0" fill="none" stroke="${col}" stroke-width="34" stroke-linecap="round" stroke-dasharray="534" stroke-dashoffset="534"/>`;
 g+=`<line class="ndl" y2="-115" stroke="#161513" stroke-width="12" stroke-linecap="round"/><circle r="20" fill="#161513"/><text y="80" text-anchor="middle" font-family="Inter" font-weight="700" font-size="54" fill="${col==='#C48C34'?'#7A4E18':'#8C867C'}">${lbl}</text>`;return g}
$("gL").innerHTML=gauge("CPL","#D8CFBF");$("gR").innerHTML=gauge("CAC","#C48C34");
const LV=["anúncio","página","prazo"];let lv="";LV.forEach((n,k)=>{const x=290+k*250;lv+=`<g transform="translate(${x} 330)"><rect x="-40" y="-20" width="80" height="40" rx="10" fill="#8C867C"/><g class="lv"><line y2="-210" stroke="#161513" stroke-width="18" stroke-linecap="round"/><circle cy="-220" r="36" class="knob" fill="#E4DED2"/></g><text y="100" text-anchor="middle" font-family="Inter" font-weight="700" font-size="36" fill="#161513">${n}</text></g>`});$("levers").innerHTML=lv;
const chips=$("chips");LV.forEach((n,k)=>{const c=document.createElement("div");c.className="pill";c.innerHTML=`<b>${k+1}</b>${n}`;chips.appendChild(c)});
let ce="";for(let d=1;d<=28;d++){const c=(d-1)%7,r=Math.floor((d-1)/7);ce+=`<g class="cl" transform="translate(${30+c*76+33} ${100+r*76+30})"><rect x="-32" y="-30" width="64" height="60" rx="12" fill="#EEE9DF"/><text y="12" text-anchor="middle" font-family="Inter" font-weight="700" font-size="28" fill="#8C867C">${d}</text></g>`}$("cells").innerHTML=ce;

// captions
const CAP=$("cap");let capSeg=-1,spans=[];
function setCap(i){if(capSeg===i)return;capSeg=i;CAP.innerHTML="";spans=[];
 const toks=S[i].text.replace("...","…").split(" ");let wi=0;
 toks.forEach(tok=>{const sp=document.createElement("span");sp.textContent=tok;const c=tok.toLowerCase().replace(/[.,:?…!]/g,"");
  if(HL[i].includes(c))sp.className="hl";sp._t=S[i].wt[Math.min(wi,S[i].wt.length-1)];if(c)wi++;CAP.appendChild(sp);spans.push(sp)});}

const fx=$("fx").getContext("2d");
function particles(t,i){fx.clearRect(0,0,1080,1920);
 // burst at each scene switch: pieces of the illustration scatter and fly into the caption words
 for(let s=1;s<S.length;s++){const lt=t-SC[s];if(lt<0||lt>1.1)continue;
  for(let n=0;n<70;n++){const r1=rnd(s*100+n),r2=rnd(s*100+n+.5),r3=rnd(s*100+n+.9);
   const sx=540+(r1-.5)*520,sy=570+(r2-.5)*300;const tx=160+r3*760,ty=860+rnd(n*7+s)*260;
   const p=eio(lt/1.0);const mx=(sx+tx)/2+(r2-.5)*500,my=Math.min(sy,ty)-180*r1;
   const x=(1-p)*(1-p)*sx+2*(1-p)*p*mx+p*p*tx,y=(1-p)*(1-p)*sy+2*(1-p)*p*my+p*p*ty;
   const a=Math.sin(Math.PI*clamp(lt/1.1))*.9;fx.globalAlpha=a;fx.fillStyle=n%3?"#C48C34":"#161513";
   const sz=4+r1*9;fx.save();fx.translate(x,y);fx.rotate(lt*8*(r2-.5));fx.fillRect(-sz/2,-sz/2,sz,sz*(.4+r3));fx.restore()}}
 fx.globalAlpha=1}

function sceneT(el,lt,dur){ // 3D enter / exit shared by all illustrations
 const ein=eo(lt/0.6), eout=eio((lt-(dur-0.35))/0.45);
 const rx=(1-ein)*-70, rot=eout*85, sc=(0.6+0.4*back(lt/0.7))*(1-0.4*eout);
 el.style.opacity=Math.min(ein,1-eout);
 el.style.filter=`blur(${(1-ein)*14+eout*16}px)`;
 el.style.transform=`translateZ(${(1-ein)*-400}px) rotateX(${rx}deg) rotateY(${rot}deg) scale(${sc*(el.id==="s9"?0.92:/s[01358]/.test(el.id)?1.0:el.id==="s6"||el.id==="s7"?1.05:1.15)})`;}

function render(t){
 $("b1").style.transform=`translate(${-260+140*Math.sin(t*.35)}px,${120+120*Math.cos(t*.27)}px)`;
 $("b2").style.transform=`translate(${520+120*Math.cos(t*.3)}px,${1150+140*Math.sin(t*.22)}px)`;
 let i=0;for(let k=0;k<SC.length;k++)if(t>=SC[k])i=k;
 const lt=t-SC[i], dur=(i<S.length-1?SC[i+1]:TL.total+5)-SC[i];
 for(let k=0;k<S.length;k++){const el=$("s"+k);if(k!==i){el.style.opacity=0;continue}sceneT(el,lt,i===9?99:dur)}
 $("cam").style.transform=`scale(${1+0.03*clamp(lt/8)})`;
 // chips: 3 levers during scenes 4..8
 const ch=$("chips");ch.style.opacity=(i>=5&&i<=8)?eo((t-SC[5])/0.4)*(i===8?1-eio((lt-(dur-0.35))/0.45):1):0;
 [...ch.children].forEach((c,k)=>{const on=i-5===k,done=i>=5&&k<i-5||i===8;c.className="pill"+(on?" on":done?" done":"");c.style.transform=`scale(${on?1+0.2*(1-eo(lt/0.5)):1})`});
 if(i===0){const g=0.75+0.25*Math.sin(lt*5);const crk=clamp((lt-1.5)/0.4);
  $("glw").setAttribute("opacity",(lt<1.5?g:g*(1-crk)));$("glw").setAttribute("r",230+30*Math.sin(lt*3));
  $("ptag").setAttribute("transform",`translate(430 ${210-(1-back(lt/0.7))*80}) rotate(${Math.sin(lt*2.5)*4*(1-crk)})`);
  $("crk").style.strokeDashoffset=360*(1-crk);const sp=eio((lt-1.9)/0.5);
  $("ptL").setAttribute("transform",`translate(${-sp*30} ${sp*30}) rotate(${-sp*10})`);$("ptR").setAttribute("transform",`translate(${sp*30} ${sp*50}) rotate(${sp*12})`);
