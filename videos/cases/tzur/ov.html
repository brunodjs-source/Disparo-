<script>
const E=__EDIT__;const W=E.words;const HL=["6","20","milhões","pablo","faltando","seis","sete","oito","dígitos","estratégia","estratégia,","funil","persona","sorte","estrategista","travou","público"];
const cl=x=>Math.max(0,Math.min(1,x)),eo=x=>1-Math.pow(1-cl(x),3),back=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
// grupos de legenda: até 4 palavras, quebra em pontuação
const G=[];let g=[];W.forEach((w,i)=>{g.push(i);if(g.length>=4||/[.,!?]$/.test(w[1])||(W[i+1]&&W[i+1][0]-w[0]>0.9)){G.push(g);g=[]}});if(g.length)G.push(g);
const P=[];for(let i=0;i<160;i++)P.push({x:Math.random()*1080,y:-50-Math.random()*900,vx:(Math.random()-.5)*6,vy:6+Math.random()*9,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,c:["#E8B36A","#fff","#C48C34","#F5C46E","#e2483d","#3d8be2"][i%6],w:12+Math.random()*12});
const set=(id,o,tr)=>{const e=document.getElementById(id);e.style.opacity=o;if(tr!==undefined)e.style.transform=tr};
function render(t){
 // legenda
 let gi=G.findIndex((gr,k)=>W[gr[0]][0]<=t&&(!G[k+1]||W[G[k+1][0]][0]>t));const cap=document.getElementById('cap');
 const lastW=W[W.length-1][0];
 if(gi<0||t>lastW+1.2){cap.innerHTML=""}else{cap.innerHTML=G[gi].map(i=>{const w=W[i],p=back((t-w[0]+.02)/.25),on=t>=w[0]-.02;const c=w[1].toLowerCase().replace(/[.,!?]/g,"");return `<span class="${HL.includes(c)?'hl':''}" style="opacity:${on?1:0};transform:scale(${on?.6+.4*p:.6}) rotateX(${(1-p)*40}deg)">${w[1]}</span>`}).join("")}
 // número 6 -> 20
 const n6=1.76,n20=4.28;let nv="",no=0;if(t>n6-.1&&t<8.0){no=cl((t-n6+.1)/.3)*(1-cl((t-7.6)/.4));nv=t<n20?"R$ 6 MI":"R$ 20 MI"}
 set('num',no,`scale(${t<n20?.9+.1*eo((t-n6)/.4):1+.25*(1-eo((t-n20)/.5))})`);document.getElementById('nv').textContent=nv;
 // rótulos de trecho
 const L=[[0,"O CASE"],[8.5,"QUEM CONTA"],[18.15,"O RESULTADO"],[29.5,"O QUE MUDOU"],[41.2,"A LIÇÃO"]];const li=L.filter(x=>x[0]<=t).pop();
 document.getElementById('lab').textContent=li?li[1]:"";set('lab',li&&!(t>n6-.1&&t<8)?cl((t-li[0])/.4):0);
 set('tag',cl((t-8.8)/.4)*(1-cl((t-12.9)/.4)),`translateX(${-(1-eo((t-8.8)/.5))*500}px)`);
 const s7=23.05,s8=24.11;let dv=t<s8?"7 dígitos/mês":"8 dígitos/mês";set('dig',cl((t-20.4)/.4)*(1-cl((t-28.5)/.4)),`scale(${t>=s8?1+.2*(1-eo((t-s8)/.5)):1})`);document.getElementById('dv').textContent=t<s7?"…":dv;
 set('cta',cl((t-48.3)/.4),`scale(${back((t-48.3)/.5)})`);
 // transição nos cortes
 const cut=E.cuts.map(c=>c.start).filter(s=>s>0).find(s=>t>=s-.2&&t<s+.25);document.getElementById('wipe').style.left=cut!==undefined?(-1300+(t-cut+.2)/.45*2600)+"px":"-1300px";

 const M0=29.5,mgo=cl((t-M0+.15)/.35);document.getElementById('mg').style.opacity=mgo;
 const dark=t>=M0;document.getElementById('cap').style.color=dark?'#161513':'#fff';document.getElementById('cap').style.textShadow=dark?'none':'';document.getElementById('cap').classList.toggle('dk',dark);
 document.getElementById('brand').style.color=dark?'#7a6f62':'#fff';document.getElementById('lab').style.color=dark?'#9A5F2A':'#fff';
 const SC=[["m1",29.5,34.5],["m2",34.5,41.2],["m3",41.2,44.5],["m4",44.5,48.2],["m5",48.2,60]];
 SC.forEach(([id,a,b])=>{const o=cl((t-a)/.35)*(1-cl((t-b+.3)/.3));set(id,o,`translateY(${(1-eo((t-a)/.5))*60}px)`)});
 set('vm',1,`scale(${back((t-29.7)/.5)})`);document.getElementById('vs').style.width=(eo((t-31.9)/.4)*92)+'%';
 set('es',cl((t-33.2)/.3),`scale(${back((t-33.2)/.5)})`);
 [["f1",35.4],["f2",37.4],["f3",39.7]].forEach(([id,a])=>{const e=document.getElementById(id);e.style.opacity=cl((t-a)/.3);e.style.transform=`scaleX(${eo((t-a)/.45)})`});
 set('f4',cl((t-40.4)/.3),`scale(${back((t-40.4)/.5)})`);
 document.getElementById('ss').style.width=(eo((t-42.2)/.4)*100)+'%';set('st',cl((t-43.25)/.2),`rotate(-8deg) scale(${1+1.5*(1-eo((t-43.25)/.3))})`);
 document.getElementById('ln').style.strokeDashoffset=1100*(1-eo((t-44.6)/1.2));document.getElementById('tv').style.opacity=cl((t-45.1)/.3);
 const txt="ESTRATEGISTA",k=Math.floor(cl((t-48.7)/.8)*txt.length);document.getElementById('bt').textContent=t<48.4?"":txt.slice(0,k)+(k<txt.length&&Math.floor(t*3)%2?"|":"");
 set('bb',cl((t-48.3)/.3),`scale(${back((t-48.3)/.5)})`);
 // confete
 const cv=document.getElementById('cf'),x=cv.getContext('2d');x.clearRect(0,0,1080,1920);const dt=t-n20;
 if(dt>0&&dt<4.5){P.forEach(p=>{const y=p.y+p.vy*dt*30+120*dt*dt,xx=p.x+p.vx*dt*30+Math.sin(dt*3+p.r)*30;x.save();x.translate(xx,y);x.rotate(p.r+p.vr*dt*30);x.fillStyle=p.c;x.globalAlpha=1-cl((dt-3.6)/.9);x.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);x.restore()})}
 // bloco motion a partir de "Não foi sorte"

}
render(0);
