<div id="back"></div>
<div id="front"><canvas id="cf" width="1080" height="1920"></canvas><div id="br"><div id="brl"></div><div id="brc"></div></div><div id="tag"><b>Pablo</b><i>Marketing · Tzur Capital</i></div><div id="cta"><div><i></i><span id="ct"></span></div></div><div id="cap"></div><div id="wipe"></div><div id="brand">ESTRATEGISTA · <i style="font-family:Pf;letter-spacing:0">de lançamento</i></div></div>

 if(layer=="back"){const b=document.getElementById('back');b.innerHTML=LT.filter(l=>t>=l[0]-.05&&t<l[1]+.35).map(l=>{const p=eo((t-l[0])/.55),out=cl((t-l[1])/.35),ext=[...Array(14)].map((_,k)=>`${k*1.5}px ${k*2}px 0 ${k<13?'rgba(60,40,15,.85)':'rgba(0,0,0,.4)'}`).join(",");
  return `<div class=L style="top:${l[5]}px;font-size:${l[4]}px;color:${l[3]};opacity:${1-out}"><span style="transform:translateY(${(1-p)*260+out*-80}px) rotateX(${(1-p)*55}deg) scale(${.85+.15*p});text-shadow:${ext},0 30px 60px rgba(0,0,0,.5)">${l[2]}</span></div>`}).join("");return}
 // front
 const bi=CUTS.findIndex(c=>t>=c-.7&&t<c+.9),br=document.getElementById('br');

 let gi=G.findIndex((gr,k)=>Wd[gr[0]][0]<=t&&(!G[k+1]||Wd[G[k+1][0]][0]>t));const last=Wd[Wd.length-1][0];
 cap.innerHTML=(gi<0||t>last+1.2)?"":G[gi].map(i=>{const w=Wd[i],p=back((t-w[0]+.02)/.25),on=t>=w[0]-.02,c=w[1].toLowerCase();return `<span class="${HL.includes(c)?'hl':''}" style="opacity:${on?1:0};transform:scale(${on?.6+.4*p:.6}) rotateX(${(1-p)*40}deg)">${w[1]}</span>`}).join("");
 const tg=document.getElementById('tag');tg.style.opacity=cl((t-9.6)/.4)*(1-cl((t-13.0)/.3));tg.style.transform=`translateX(${-(1-eo((t-9.6)/.5))*500}px)`;
 const kw="ESTRATEGISTA",a=48.7,k=Math.floor(cl((t-a)/.8)*kw.length),cta=document.getElementById('cta');cta.style.opacity=cl((t-48.35)/.3);cta.style.transform=`scale(${back((t-48.35)/.5)})`;document.getElementById('ct').textContent="Comenta "+kw.slice(0,k);
 const cut=CUTS.find(s=>(t>=s-.95&&t<s-.6)||(t>=s+.75&&t<s+1.1));const st=cut===undefined?null:(t<cut?cut-.95:cut+.75);document.getElementById('wipe').style.left=st===null?"-1300px":(-1300+(t-st)/.35*2600)+"px";

 if(dt>0&&dt<4.5){P.forEach(p=>{const y=p.y+p.vy*dt*30+120*dt*dt,xx=p.x+p.vx*dt*30+Math.sin(dt*3+p.r)*30;x.save();x.translate(xx,y);x.rotate(p.r+p.vr*dt*30);x.fillStyle=p.c;x.globalAlpha=1-cl((dt-3.6)/.9);x.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);x.restore()})}}

</script></body></html>
