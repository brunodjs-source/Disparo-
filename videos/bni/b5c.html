const $=id=>document.getElementById(id),cl=x=>Math.max(0,Math.min(1,x)),eo=p=>1-Math.pow(1-cl(p),3),spr=p=>{p=cl(p);return 1-Math.exp(-6*p)*Math.cos(8*p)};

 42.46], ["Então", 43.12], ["você", 43.26], ["precisa", 43.52], ["saber", 43.74], ["vender", 44.1], ["pelo", 44.38], ["site", 44.6], ["com", 44.92], ["uma", 45.16], ["estratégia", 45.22], ["correta.", 45.72]],END=46.35,DUR=50.9,NF=1391,A2=25.2,P52=29.68,P29=33.7;
const TT=[[0.0,1.95,'furo 2','site'],[2.0,6.15,'o seu site','é a sua casa'],[6.2,9.5,'enfeite','ou referência?'],[9.54,12.65,'muita gente tem site','e não sabe o que traz'],[12.7,16.9,'paga servidor','e manutenção'],[16.96,21.7,'manda tráfego','para o caminho certo?'],[21.78,A2-0.05,'é preciso','corrigir a casa'],[A2,P52-0.05,'olha','os números'],[P52,P29-0.05,'52% das empresas','têm site'],[P29,39.27,'só 29%','vendem pelo site'],[39.32,43.07,'é metade','do negócio'],[43.12,END,'venda pelo site','com estratégia']];
const nf=n=>String(Math.min(NF,Math.max(1,n))).padStart(5,'0');
// funil dourado em traco, 4 furos; o furo 1 pisca e vaza
function funil(t,cx,cy,s,lit,seal,cur=1,done=[0]){let g=`<g transform="translate(${cx},${cy}) scale(${s})">`;
 g+=`<path d="M-150 -170 L150 -170 L40 40 L40 170 L-40 170 L-40 40 Z" fill="rgba(20,18,16,.55)" stroke="#E8B36A" stroke-width="7" stroke-linejoin="round"/>`;
 const H=[[-95,-120],[60,-70],[-20,0],[0,110]];
 H.forEach(([x,y],i)=>{const on=i===cur&&lit;const r=on?16+4*Math.sin(t*12):12;
  g+=`<circle cx="${x}" cy="${y}" r="${r}" fill="${on?'#ff5a3c':'#141210'}" stroke="#E8B36A" stroke-width="4"/>`;
  if((done.includes(i)?1:(i===cur?seal:0))>0)g+=`<rect x="${x-26}" y="${y-14}" width="52" height="28" rx="6" fill="#E8B36A" opacity="${done.includes(i)?1:seal}" transform="rotate(-12 ${x} ${y})"/>`;
  if(on){for(let k=0;k<4;k++){const a=((t*1.6+k*0.25)%1);g+=`<circle cx="${x-10-a*80}" cy="${y+a*a*260}" r="${9*(1-a)+4}" fill="#E8B36A" opacity="${1-a}"/>`}}});
 return g+`</g>`}

 return `<g opacity="${o}" transform="translate(${x},${y}) rotate(-25)"><circle r="120" fill="rgba(255,240,210,.12)" stroke="#E8B36A" stroke-width="14"/><circle r="120" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="3" stroke-dasharray="60 400"/><rect x="-16" y="128" width="32" height="170" rx="14" fill="#B8862F"/></g>`}
function casa(t){const p=eo((t-2.0)/0.6);if(t<2.0||t>=A2)return '';const cr=cl((t-6.24)/0.4)*(1-cl((t-22.6)/0.5));let g=`<g transform="translate(770,860) scale(${0.6+0.4*p})" opacity="${p}">`;
 g+=`<path d="M-190 -40 L0 -200 L190 -40" fill="none" stroke="#E8B36A" stroke-width="10" stroke-linejoin="round"/><rect x="-160" y="-40" width="320" height="260" rx="10" fill="rgba(20,18,16,.6)" stroke="#E8B36A" stroke-width="8"/>`;
 g+=`<rect x="-160" y="-40" width="320" height="40" rx="10" fill="#E8B36A"/><circle cx="-135" cy="-20" r="7" fill="#141210"/><circle cx="-112" cy="-20" r="7" fill="#141210"/><circle cx="-89" cy="-20" r="7" fill="#141210"/>`;
 g+=`<rect x="-40" y="110" width="80" height="110" rx="6" fill="#141210" stroke="#E8B36A" stroke-width="5"/>`;
 if(cr>0){g+=`<path d="M60 0 L30 50 L70 90 L35 150" fill="none" stroke="#ff5a3c" stroke-width="7" opacity="${cr}"/>`;for(let k=0;k<5;k++){const a=((t*1.3+k*0.2)%1);g+=`<circle cx="${-10+a*160}" cy="${200+a*a*240}" r="${16*(1-a)+6}" fill="#E8B36A" opacity="${cr*(1-a)}"/>`}}
 return g+`</g>`}
function barras(t){if(t<A2+0.3||t>=END)return '';const o=eo((t-A2-0.3)/0.4),b1=eo((t-P52)/0.9)*0.52,b2=eo((t-P29)/0.9)*0.29,H=900;
 let g=`<g opacity="${o}"><line x1="600" y1="1080" x2="960" y2="1080" stroke="#E8B36A" stroke-width="4"/>`;
 g+=`<rect x="620" y="${1080-H*b1}" width="140" height="${H*b1}" fill="#E8B36A" rx="8"/><rect x="800" y="${1080-H*b2}" width="140" height="${H*b2}" fill="#ff8a5c" rx="8"/>`;
 if(b1>0.01)g+=`<text x="690" y="${1060-H*b1}" text-anchor="middle" font-family="PF" font-size="56" fill="#FFF6EA">${Math.round(b1*100)}%</text><text x="690" y="1124" text-anchor="middle" font-family="Inter" font-weight="700" font-size="28" fill="#FFE7C4">têm site</text>`;
 if(b2>0.01)g+=`<text x="870" y="${1060-H*b2}" text-anchor="middle" font-family="PF" font-size="56" fill="#FFF6EA">${Math.round(b2*100)}%</text><text x="870" y="1124" text-anchor="middle" font-family="Inter" font-weight="700" font-size="28" fill="#FFE7C4">vendem</text>`;
 return g+`</g>`}

 let fx='';if(t<2.0)fx+=funil(t,800,820,0.95*eo(t/0.5)*(1-cl((t-1.7)/0.3)),t>=0.3,0);fx+=casa(t)+barras(t);$('fx').innerHTML=fx;
 let tt='';for(const [a,b,r,i] of TT)if(t>=a&&t<b){const p=eo((t-a)/0.45),q=cl((t-b+0.2)/0.2);
  tt=`<div class="r" style="opacity:${p*(1-q)}">${r}</div><div class="i" style="opacity:${eo((t-a-0.1)/0.45)*(1-q)};filter:blur(${(1-eo((t-a-0.1)/0.45))*8}px)">${i}</div>`}
 $('tt').innerHTML=tt;
 // 46% sobe na palavra
 const bp=(t-10.64)/1.4;$('big').style.opacity=0;$('bv').textContent=Math.round(46*eo(bp))+'%';

}
