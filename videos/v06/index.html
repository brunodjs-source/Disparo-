.box{position:relative;width:200px;height:200px;transform-style:preserve-3d}
.box .f{position:absolute;width:200px;height:200px;border-radius:14px}
.part{position:absolute;width:150px;height:56px;transform-style:preserve-3d}
.part .t,.part .fr,.part .sd{position:absolute;border-radius:6px}
.chip{width:120px;height:58px;border-radius:29px;border:3px solid var(--line);background:#fff;font:700 26px Inter;color:var(--dim);display:flex;align-items:center;justify-content:center}
.chip.on{border-color:var(--gold);background:var(--gold);color:#fff;box-shadow:0 8px 20px rgba(196,140,52,.35)}
#chips{position:absolute;top:815px;width:100%;display:flex;gap:26px;justify-content:center;opacity:0}
.big3d{font:800 150px Play;color:var(--gold);text-shadow:1px 1px 0 #b07a28,2px 2px 0 #a8742a,3px 3px 0 #9c6a22,4px 4px 0 #925f1e,5px 5px 0 #8a5c1c,6px 6px 0 #835619,7px 7px 0 #7a4e18,8px 8px 0 #704615,14px 22px 26px rgba(90,60,20,.3)}

<script>
const TL = __TIMELINE__;
const S = TL.segs, $ = id => document.getElementById(id);
const HL = [["carrinho","esperando","vendas"],["largada","chegada"],["cada","dia","ação"],["dia","um","bônus","primeiro"],["dia","dois","depoimentos","prova"],["dia","três","live","objeções"],["último","dia","todos","canais"],["hora","últimas","horas"],["whatsapp","clicou","não","comprou"],["carrinho","cronograma"]];
const SC = S.map(s => s.start - 0.35);
const clamp = (x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo = x => 1-Math.pow(1-clamp(x),4);
const eio = x => {x=clamp(x);return x<.5?8*x*x*x*x:1-Math.pow(-2*x+2,4)/2};
const back = x => {x=clamp(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const elastic = x => {x=clamp(x);return x===0?0:x===1?1:Math.pow(2,-10*x)*Math.sin((x*10-.75)*2*Math.PI/3)+1};
function rnd(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)}
const DL=["D1","D2","D3","ÚLT."];
// calendar pages
let cl="";DL.forEach((d,k)=>{cl+=`<g class="cp" transform="translate(${255+k*190} 220)"><g class="cpi"><rect x="-80" y="-110" width="160" height="200" rx="16" fill="#fff" stroke="#E4DED2" stroke-width="5"/><rect x="-80" y="-110" width="160" height="50" rx="16" fill="${k==3?'#161513':'#C48C34'}"/><rect x="-80" y="-75" width="160" height="15" fill="${k==3?'#161513':'#C48C34'}"/><circle cx="-40" cy="-118" r="8" fill="#7A4E18"/><circle cx="40" cy="-118" r="8" fill="#7A4E18"/><text y="40" text-anchor="middle" font-family="Play" font-weight="800" font-size="${k==3?52:72}" fill="#161513">${d}</text></g><g class="cpk" transform="translate(45 60)"><circle r="24" fill="#2FA84F"/><path d="M-10 0 L-3 8 L11 -8" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/></g></g>`});$("cal").innerHTML=cl+`<path id="calln" d="M255 360 H825" stroke="#C48C34" stroke-width="8" stroke-linecap="round" stroke-dasharray="570" stroke-dashoffset="570"/>`;
const chips=$("chips");DL.forEach(d=>{const c=document.createElement("div");c.className="chip";c.textContent=d;chips.appendChild(c)});
let ry="";for(let k=0;k<14;k++){const a=k/14*Math.PI*2;ry+=`<path d="M0 0 L${Math.cos(a-.1)*250} ${Math.sin(a-.1)*190} L${Math.cos(a+.1)*250} ${Math.sin(a+.1)*190}Z" fill="#F4DDB0"/>`}$("rays").innerHTML=ry;
let cd="";for(let k=0;k<3;k++){let st="";for(let j=0;j<5;j++)st+=`<path class="st" d="M0 -16 L4.7 -6.5 L15.2 -4.9 L7.6 2.5 L9.4 13 L0 8 L-9.4 13 L-7.6 2.5 L-15.2 -4.9 L-4.7 -6.5Z" transform="translate(${-80+j*40} 40)" fill="#C48C34"/>`;
 cd+=`<g class="card"><rect x="-200" y="-75" width="400" height="150" rx="20" fill="#fff" stroke="#E4DED2" stroke-width="5"/><circle cx="-140" cy="-15" r="34" fill="#161513"/><rect x="-90" y="-45" width="230" height="16" rx="8" fill="#E4DED2"/><rect x="-90" y="-18" width="180" height="14" rx="7" fill="#EEE9DF"/>${st}<text x="-182" y="-30" font-family="Play" font-weight="800" font-size="60" fill="#E2B56B">“</text></g>`}$("cards").innerHTML=cd;
let qa="";for(let k=0;k<3;k++)qa+=`<g class="qa" transform="translate(${700+(k%2)*60} ${60+k*115})"><g class="qai"><rect x="0" y="0" width="230" height="84" rx="20" fill="#fff" stroke="#E4DED2" stroke-width="4"/><text x="40" y="58" text-anchor="middle" font-family="Inter" font-weight="700" font-size="44" fill="#C0392B">?</text><rect x="72" y="26" width="130" height="12" rx="6" fill="#E4DED2"/><rect x="72" y="48" width="96" height="12" rx="6" fill="#EEE9DF"/><g class="qak" transform="translate(40 42)"><circle r="26" fill="#2FA84F"/><path d="M-11 0 L-3 8 L12 -9" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/></g></g></g>`;$("qas").innerHTML=qa;
const CH=[[200,90,"mail"],[880,90,"insta"],[200,330,"phone"],[880,330,"chat"]];let chs="";
CH.forEach(([x,y,k])=>{let ic="";if(k=="mail")ic=`<rect x="-55" y="-38" width="110" height="76" rx="10" fill="#fff" stroke="#161513" stroke-width="6"/><path d="M-55 -34 L0 8 L55 -34" fill="none" stroke="#161513" stroke-width="6"/>`;
 if(k=="insta")ic=`<rect x="-46" y="-46" width="92" height="92" rx="26" fill="none" stroke="#161513" stroke-width="8"/><circle r="22" fill="none" stroke="#161513" stroke-width="8"/><circle cx="26" cy="-26" r="6" fill="#161513"/>`;
 if(k=="phone")ic=`<rect x="-34" y="-55" width="68" height="110" rx="14" fill="#161513"/><rect x="-26" y="-42" width="52" height="78" rx="4" fill="#fff"/><circle cy="45" r="5" fill="#fff"/>`;
 if(k=="chat")ic=`<path d="M-52 -40 H52 Q62 -40 62 -30 V22 Q62 32 52 32 H-10 L-36 52 L-30 32 H-52 Q-62 32 -62 22 V-30 Q-62 -40 -52 -40Z" fill="#161513"/><rect x="-36" y="-18" width="72" height="10" rx="5" fill="#fff"/><rect x="-36" y="2" width="48" height="10" rx="5" fill="#fff"/>`;
 chs+=`<g class="chn" data-x="${x}" data-y="${y}"><circle r="78" fill="#fff" stroke="#E4DED2" stroke-width="5"/>${ic}<g class="nb" transform="translate(56 -56)"><circle r="22" fill="#C0392B"/><text y="9" text-anchor="middle" font-family="Inter" font-weight="700" font-size="26" fill="#fff">1</text></g></g>`});$("chans").innerHTML=chs;
let hr="";["03:00","02:00","01:00","00:59"].forEach((h,k)=>hr+=`<text class="hr" y="50" text-anchor="middle" font-family="Play" font-weight="800" font-size="96" fill="${k==3?'#C0392B':'#161513'}">${h}</text>`);$("hrs").innerHTML=hr;
let pg="";for(let k=0;k<3;k++)pg+=`<g class="pg"><rect x="-130" y="-40" width="260" height="80" rx="20" fill="#fff" stroke="#E4DED2" stroke-width="4"/><circle cx="-90" r="22" fill="#C48C34"/><path d="M-100 6 Q-100 -14 -90 -14 Q-80 -14 -80 6Z M-104 6 H-76" stroke="#fff" stroke-width="4" fill="#fff"/><rect x="-55" y="-16" width="150" height="12" rx="6" fill="#E4DED2"/><rect x="-55" y="6" width="110" height="12" rx="6" fill="#EEE9DF"/></g>`;$("pings").innerHTML=pg;
// captions
const CAP=$("cap");let capSeg=-1,spans=[];
function setCap(i){if(capSeg===i)return;capSeg=i;CAP.innerHTML="";spans=[];
 const toks=S[i].text.replace("...","…").split(" ");let wi=0;
 toks.forEach(tok=>{const sp=document.createElement("span");sp.textContent=tok;const c=tok.toLowerCase().replace(/[.,:?…!]/g,"");
  if(HL[i].includes(c))sp.className="hl";sp._t=S[i].wt[Math.min(wi,S[i].wt.length-1)];if(c)wi++;CAP.appendChild(sp);spans.push(sp)});}

const fx=$("fx").getContext("2d");
function particles(t,i){fx.clearRect(0,0,1080,1920);
 // burst at each scene switch: pieces of the illustration scatter and fly into the caption words
 for(let s=1;s<S.length;s++){const lt=t-SC[s];if(lt<0||lt>1.1)continue;
  for(let n=0;n<70;n++){const r1=rnd(s*100+n),r2=rnd(s*100+n+.5),r3=rnd(s*100+n+.9);
   const sx=540+(r1-.5)*520,sy=570+(r2-.5)*300;const tx=160+r3*760,ty=860+rnd(n*7+s)*260;
   const p=eio(lt/1.0);const mx=(sx+tx)/2+(r2-.5)*500,my=Math.min(sy,ty)-180*r1;
