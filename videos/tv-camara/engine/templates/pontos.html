<!doctype html><html><head><meta charset="utf-8"></head><body><script>/*__BASE__*/
// PONTOS · chuva de pontos escrevendo o assunto no instante em que o Bruno diz a palavra.
// C.assuntos = [{t, palavra}]  (t = início da palavra no Whisper; o primeiro pode ser negativo: já formado no quadro 0)
// C.frases = [{a, b, ws:[[t, txt]]}] (legenda digitada)  C.nome=[a,b]  C.lista={a, titulo}  C.rotulo  C.cta
const ZY0 = 250, ZY1 = 600, CX = 500, LARG = 860; let RAIO = [];
const CORES = ['#F5C46E', '#E8B36A', '#C98E45'];
// alvos de cada palavra: texto em Cinzel 900 desenhado fora da tela e amostrado numa grade de G px
let ALVOS = null, N = 0, SEM = [];
function preparar() { ALVOS = C.assuntos.map(a => {
  const cv = document.createElement('canvas'); cv.width = 1080; cv.height = 700; const x = cv.getContext('2d');
  const fs = Math.min(caber(a.palavra, 'Cinzel', LARG, 220), 220), G = Math.max(7, Math.min(12, Math.round(fs / 12)));
  RAIO.push(G * .39);
  x.font = `900 ${fs}px Cinzel`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#fff';
  x.fillText(a.palavra, CX, 350); const d = x.getImageData(0, 0, 1080, 700).data, pts = [];
  for (let yy = G / 2; yy < 700; yy += G) for (let xx = 0; xx < 1080; xx += G) if (d[(yy * 1080 + xx) * 4 + 3] > 140) pts.push([xx, yy - 350 + (ZY0 + ZY1) / 2]);
  pts.sort((p, q) => p[0] - q[0] || p[1] - q[1]); return pts;
});
N = Math.max(...ALVOS.map(a => a.length)) + 40;
_s = 31; SEM = [...Array(N)].map(() => [rnd(), rnd(), rnd(), Math.floor(rnd() * 3)]); }
function estado(t) {             // devolve [x, y, raio, cor(0..1 ouro), visível] por ponto, função pura do tempo
  let k = -1; for (let i = 0; i < C.assuntos.length; i++) if (t >= C.assuntos[i].t) k = i;
  if (k < 0) return [];
  const T = ALVOS[k], tk = C.assuntos[k].t, P = k > 0 ? ALVOS[k - 1] : [];
  const xs = T.map(p => p[0]), mn = Math.min(...xs), mx = Math.max(...xs);
  const out = [];
  for (let i = 0; i < Math.max(T.length, P.length); i++) {
    const s = SEM[i], R = RAIO[k], RP = k > 0 ? RAIO[k - 1] : R;
    if (i < T.length) {
      const [tx, ty] = T[i], atraso = .22 * (tx - mn) / Math.max(1, mx - mn) + .08 * s[0];
      if (i < P.length) {        // ponto que já existia: voa com mola até o novo alvo
        const p = mola((t - tk - atraso * .5) / .65);
        out.push([P[i][0] + (tx - P[i][0]) * p, P[i][1] + (ty - P[i][1]) * p - Math.sin(Math.PI * cl(p)) * 60 * s[1], RP + (R - RP) * cl(p), 1, s[3]]);
      } else {                   // ponto novo: cai do topo com gravidade e quica
        const alt = ty + 40 + s[1] * 160, tau = t - tk - atraso, y = ty - queda(tau, alt, 5200, .24, 1);
        const pousou = tau > Math.sqrt(2 * alt / 5200);
        out.push([tx, y, R, pousou ? cl((tau - Math.sqrt(2 * alt / 5200)) / .2) : 0, s[3]]);
      }
    } else {                     // sobra da palavra anterior: encolhe até sumir
      const r = RP * (1 - cl((t - tk) / .3)); if (r > 0) out.push([P[i][0], P[i][1], r, 1, s[3]]);
    }
  }
  return out;
}
let cv = null, ov = null;
function legendaDigitada(t) {
  let f = null; for (const x of C.frases) if (t >= x.a - .05 && t < x.b) f = x; if (!f) return '';
  const txt = f.ws.map(([tw, w], i) => { const n = Math.floor(cl((t - tw) / .12) * w.length); return n ? w.slice(0, n) : ''; }).join(' ').replace(/\s+$/, '');
  if (!txt) return '';
  const fs = 44;
  return `<div style="position:absolute;left:64px;right:136px;top:640px;text-align:center"><span style="display:inline-block;background:rgba(20,18,16,.84);border-radius:16px;padding:12px 22px 14px;font-weight:800;font-size:${fs}px;line-height:1.15;color:${CREME}">${txt}<span style="color:${OURO};opacity:${Math.floor(t * 3) % 2}">|</span></span></div>`;
}
function lista(t) {
  const L = C.lista; if (!L || t < L.a) return '';
  const p = eo((t - L.a) / .4);
  return `<div style="position:absolute;inset:0;background:rgba(10,9,8,${.72 * p})"></div><div style="position:absolute;left:90px;right:150px;top:${360}px;opacity:${p}">
   <div style="font-family:Cinzel;font-weight:900;font-size:34px;letter-spacing:.14em;color:${OURO};margin-bottom:34px">${L.titulo}</div>` +
   C.assuntos.map((a, i) => { const q = mola((t - L.a - .15 - i * .12) / .5);
     return `<div style="display:flex;align-items:baseline;gap:26px;margin:0 0 22px;opacity:${cl(q * 2)};transform:translateX(${(1 - q) * -60}px)"><span style="font-family:Cinzel;font-weight:900;font-size:64px;color:${OURO2};width:70px">${i + 1}</span><span style="font-family:Cinzel;font-weight:900;font-size:62px;color:${CREME}">${a.palavra}</span></div>`; }).join('') +
   (C.cta ? `<div style="margin-top:46px;font-size:38px;font-weight:800;color:#fff;opacity:${eo((t - L.a - .9) / .4)}">${C.cta}</div>` : '') + '</div>';
}
function render(t, camada) {
  const el = document.getElementById(camada); if (camada !== 'front') { el.innerHTML = ''; return; }
  if (!ALVOS) preparar();
  if (!cv) { el.innerHTML = '<div id=fx></div><canvas id=cv width=1080 height=1920 style="position:absolute;inset:0"></canvas><div id=ov></div>'; cv = document.getElementById('cv').getContext('2d'); ov = document.getElementById('ov'); }
  const fim = C.lista && t >= C.lista.a;
  document.getElementById('fx').innerHTML = topoEscuro(.2 + .5 * cl((t - .9) / .6), 900);
  cv.clearRect(0, 0, 1080, 1920);
  if (!fim || t < C.lista.a + .4) {
    const sai = C.lista ? 1 - cl((t - C.lista.a) / .4) : 1;
    for (const [x, y, r, o, c] of estado(t)) {
      if (y < -20) continue;
      const g = cv.createRadialGradient(x - r * .3, y - r * .3, 0, x, y, r);
      g.addColorStop(0, '#FFF4DC'); g.addColorStop(.45, o > .5 ? CORES[c] : CREME); g.addColorStop(1, o > .5 ? '#7a4a1e' : '#b9b0a2');
      cv.globalAlpha = sai; cv.fillStyle = g; cv.beginPath(); cv.arc(x, y, r * (o > 0 ? 1 : .9), 0, 7); cv.fill();
    }
    cv.globalAlpha = 1;
  }
  let h = '';
  if (!fim) { h += rotulo(t, C.rotulo, 236, 56); h += legendaDigitada(t); if (C.nome) h += nomeTV(t, C.nome[0], C.nome[1]); }
  h += lista(t);
  ov.innerHTML = h;
}
</script></body></html>
