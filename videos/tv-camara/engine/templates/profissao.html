<!doctype html><html><head><meta charset="utf-8"></head><body><script>/*__BASE__*/
// PROFISSAO · o que eu disse na TV para o [profissional]. Connect Hook com a profissão, faixa "NA TV" com a frase literal
// correndo até ele dizer a frase (para e fica 1,5 s), CTA de envio para um colega.
// C.gancho {a, ate, txt, chave, linha}  C.faixa {a, txt, para, ate}  C.nome [a,b]  C.cta {a, txt}
function faixaNA(t) {
  const F = C.faixa; if (!F || t < F.a || t > F.ate + .3) return '';
  const o = cl((t - F.a) / .3) * (1 - cl((t - F.ate) / .3)), ent = eo((t - F.a) / .4);
  if (!faixaNA.w) { _mc.font = '800 46px Inter'; faixaNA.w = _mc.measureText(F.txt).width; }
  const L = 860, x = t < F.para ? L - (t - F.a) * 120 % (faixaNA.w + L) : Math.max(0, (L - faixaNA.w) / 2);
  const parou = t >= F.para;
  return `<div style="position:absolute;left:40px;right:140px;top:1150px;height:180px;opacity:${o};transform:translateX(${(1 - ent) * -80}px);background:rgba(20,18,16,.92);border-top:4px solid ${OURO};border-radius:0 0 14px 14px;overflow:hidden">
    <div style="position:absolute;left:24px;top:20px;display:flex;align-items:center;gap:16px"><span style="background:${OURO};color:${ESC};font-family:Cinzel;font-weight:900;font-size:30px;padding:6px 14px 4px;border-radius:6px">NA TV</span><span style="font-size:24px;font-weight:700;color:#cfc6b6;letter-spacing:.06em">ENTREVISTA À TV CÂMARA CAMPINAS</span></div>
    ${parou ? `<div style="position:absolute;left:24px;right:24px;top:78px;font-size:36px;line-height:1.14;font-weight:800;color:${OURO2}">${F.txt}</div></div>`
    : `<div style="position:absolute;left:0;right:0;top:86px;height:80px;overflow:hidden"><div style="position:absolute;top:10px;left:${x + 20}px;white-space:nowrap;font-size:46px;font-weight:800;color:${CREME}">${F.txt}</div></div></div>`}`;
}
function ctaEnvio(t) {
  const K = C.cta; if (!K || t < K.a) return '';
  const p = back((t - K.a) / .45);
  return `<div style="position:absolute;inset:0;background:rgba(10,9,8,${.6 * cl((t - K.a) / .4)})"></div><div style="position:absolute;left:80px;right:140px;top:620px;text-align:center;transform:scale(${.85 + .15 * p});opacity:${cl(p * 2)}">
   <div style="font-family:Cinzel;font-weight:900;font-size:56px;line-height:1.18;color:${CREME}">${K.txt}</div>
   <div style="width:${eo((t - K.a - .3) / .4) * 140}px;height:3px;background:${OURO};margin:30px auto 0"></div></div>`;
}
// entre dois grupos da fala (até 2 s), segura o grupo anterior até o próximo entrar (mesma lógica do manchete.html):
// a cauda de 'fazendo' e de 'sucesso' (com o 'né?' que a ficha tira) e o quadro entre 'famosa,' e 'onde' não ficam sem legenda
function legendaSegura(t, top) {
  const h = legendaGigante(t, top); if (h) return h;
  let gi = -1; for (let k = 0; k < GRUPOS.length; k++) if (WD[GRUPOS[k][0]][0] - .03 <= t) gi = k;
  if (gi < 0 || gi === GRUPOS.length - 1) return '';
  const g = GRUPOS[gi], ult = WD[g[g.length - 1]][0];
  return WD[GRUPOS[gi + 1][0]][0] - ult > 2 ? '' : legendaGigante(ult + .85, top);
}
function render(t, camada) {
  const el = document.getElementById(camada); if (camada !== 'front') { el.innerHTML = ''; return; }
  let h = topoEscuro(.55, 860);
  const G = C.gancho;
  if (G && t < G.ate + .3) h += `<div style="opacity:${1 - cl((t - G.ate) / .25)}">${connectHook(t, G.a, G.txt, G.chave, 330, G.linha)}</div>`;
  // a legenda entra quando o gancho já quase sumiu (antes ela pousava em cima do gancho por 0,25 s)
  const entra = G ? cl((t - G.ate - .2) / .15) : 1;
  if (entra > 0 && !(C.cta && t >= C.cta.a)) h += `<div style="opacity:${entra}">${legendaSegura(t, 400)}</div>`;
  h += rotulo(t, C.rotulo, 236, 56);
  if (C.nome) h += nomeTV(t, C.nome[0], C.nome[1]);
  h += faixaNA(t) + ctaEnvio(t);
  el.innerHTML = h;
}
</script></body></html>
