<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;src:url(/usr/share/fonts/opentype/inter/Inter-Bold.otf);font-weight:700}
@font-face{font-family:Inter;src:url(/usr/share/fonts/opentype/inter/Inter-SemiBold.otf);font-weight:600}
@font-face{font-family:Play;src:url(fonts/Playfair.ttf);font-weight:100 900}
:root{--bg:#FAF9F6;--txt:#161513;--gold:#C48C34;--goldD:#7A4E18;--dim:#8C867C;--line:#E4DED2}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--bg);font-family:Inter}
.blob{position:absolute;border-radius:50%;filter:blur(110px);opacity:.55}
#label{position:absolute;top:280px;width:100%;text-align:center;font:600 34px Inter;letter-spacing:9px;color:var(--gold)}
#label:after{content:"";display:block;width:80px;height:2px;background:var(--gold);margin:22px auto 0}
#cam{position:absolute;inset:0;transform-origin:50% 40%}
#illus{position:absolute;left:0;top:380px;width:1080px;height:420px;perspective:1400px}
.sc{position:absolute;inset:0;transform-style:preserve-3d;display:flex;align-items:center;justify-content:center;opacity:0}
#cap{position:absolute;left:90px;right:90px;top:920px;text-align:center;font:700 72px/92px Inter;color:var(--txt);perspective:900px}
#cap span{display:inline-block;margin:0 9px;transform-origin:50% 100%;will-change:transform}
#cap span.hl{color:var(--gold);text-shadow:1px 1px 0 #d9a85a,2px 2px 0 #c99a4e,3px 3px 0 #b8893f,5px 8px 12px rgba(90,60,20,.18)}
canvas{position:absolute;inset:0}
/* 3D box */
.box{position:relative;width:200px;height:200px;transform-style:preserve-3d}
.box .f{position:absolute;width:200px;height:200px;border-radius:14px}
.part{position:absolute;width:150px;height:56px;transform-style:preserve-3d}
.part .t,.part .fr,.part .sd{position:absolute;border-radius:6px}
.chip{width:58px;height:58px;border-radius:50%;border:3px solid var(--line);background:#fff;font:700 28px Inter;color:var(--dim);display:flex;align-items:center;justify-content:center}
.chip.on{border-color:var(--gold);background:var(--gold);color:#fff;box-shadow:0 8px 20px rgba(196,140,52,.35)}
#chips{position:absolute;top:815px;width:100%;display:flex;gap:26px;justify-content:center;opacity:0}
.big3d{font:800 120px Play;color:var(--gold);text-shadow:1px 1px 0 #b07a28,2px 2px 0 #a8742a,3px 3px 0 #9c6a22,4px 4px 0 #925f1e,5px 5px 0 #8a5c1c,6px 6px 0 #835619,7px 7px 0 #7a4e18,8px 8px 0 #704615,14px 22px 26px rgba(90,60,20,.3)}
</style></head>

   <g class="chn" transform="translate(540 210)"><g class="ci"><path d="M-95 -75 H95 Q110 -75 110 -60 V40 Q110 55 95 55 H-30 L-75 95 V55 H-95 Q-110 55 -110 40 V-60 Q-110 -75 -95 -75Z" fill="#fff" stroke="#161513" stroke-width="10" stroke-linejoin="round"/><path class="dr" d="M-55 -10 H55 M-55 -40 H30" stroke="#C48C34" stroke-width="10" stroke-linecap="round" stroke-dasharray="120" stroke-dashoffset="120"/></g><text y="130" text-anchor="middle" font-family="Inter" font-weight="700" font-size="30" fill="#161513">WhatsApp</text></g>

    <g id="qb"><circle cx="230" cy="-80" r="40" fill="#161513"/><text x="230" y="-62" text-anchor="middle" font-family="Inter" font-weight="700" font-size="50" fill="#FAF9F6">?</text></g>
    <rect id="ln1" x="-150" y="-10" width="0" height="22" rx="11" fill="#E4DED2"/>

 </div>
 <!-- 7 pequeno passo, grande palco -->
 <div class="sc" id="s7">
  <svg width="1080" height="420" viewBox="0 0 1080 420" style="overflow:visible">
   <path id="beam7" d="M770 10 L890 10 L1030 380 L560 380Z" fill="#F4DDB0" opacity="0"/>
   <line x1="80" y1="380" x2="1000" y2="380" stroke="#E4DED2" stroke-width="6" stroke-linecap="round"/>
   <rect id="stp" x="330" y="320" width="150" height="60" rx="8" fill="#E2B56B"/>

   <g id="guy"><circle cy="-95" r="26" fill="#161513"/><path d="M-30 0 Q-30 -60 0 -60 Q30 -60 30 0Z" fill="#161513"/></g>

  </svg>
 </div>
 <!-- 8 CTA -->
 <div class="sc" id="s8" style="flex-direction:column">
  <div class="big3d" id="ctaw">AQUECIMENTO</div>
  <div id="cbox" style="margin-top:40px;width:860px;height:104px;border-radius:52px;background:#fff;border:3px solid var(--gold);box-shadow:4px 10px 0 #E4DED2;display:flex;align-items:center;padding:0 34px 0 50px;font:600 44px Inter;color:var(--txt)">
   <span id="ctxt"></span><span id="caret" style="width:4px;height:50px;background:var(--gold);margin-left:6px"></span>
   <span style="margin-left:auto;width:70px;height:70px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center"><svg width="34" height="34" viewBox="0 0 34 34"><path d="M17 30 V5 M6 15 L17 4 L28 15" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  </div>
 </div>
</div>
<div id="chips"></div>
<div id="cap"></div>
</div>
<canvas id="fx" width="1080" height="1920"></canvas>
</div>
<script>
const TL = __TIMELINE__;
const S = TL.segs, $ = id => document.getElementById(id);
const HL = [["inscreveu","esqueceu","seguinte"],["perde","audiência","inscrição","evento"],["intervalo","trabalho"],["três","coisas"],["motivo","sabendo"],["lembrete","canal","e-mail","whatsapp","stories"],["pequena","tarefa","pergunta"],["compromete","pequeno","grande"],["aquecimento"]];
const SC = S.map(s => s.start - 0.35);
const clamp = (x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo = x => 1-Math.pow(1-clamp(x),4);
const eio = x => {x=clamp(x);return x<.5?8*x*x*x*x:1-Math.pow(-2*x+2,4)/2};
const back = x => {x=clamp(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const elastic = x => {x=clamp(x);return x===0?0:x===1?1:Math.pow(2,-10*x)*Math.sin((x*10-.75)*2*Math.PI/3)+1};
function rnd(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)}

// build static bits
const chips=$("chips");for(let k=0;k<3;k++){const c=document.createElement("div");c.className="chip";c.textContent=k+1;chips.appendChild(c)}
let pp="";for(let k=0;k<14;k++)pp+=`<circle class="pd" r="13" fill="${k%4?'#C48C34':'#161513'}"/>`;$("ppl1").innerHTML=pp;
function gear(r,n){let d="";for(let k=0;k<n*2;k++){const a=k/(n*2)*Math.PI*2,a2=(k+1)/(n*2)*Math.PI*2,R=k%2?r:r+18;d+=(k?"L":"M")+(Math.cos(a)*R).toFixed(1)+" "+(Math.sin(a)*R).toFixed(1)+"L"+(Math.cos(a2)*R).toFixed(1)+" "+(Math.sin(a2)*R).toFixed(1)}return d+"Z"}
$("g1").innerHTML=`<g class="gr"><path d="${gear(70,10)}" fill="#161513"/><circle r="26" fill="#FAF9F6"/></g>`;
$("g2").innerHTML=`<g class="gr"><path d="${gear(46,8)}" fill="#C48C34"/><circle r="16" fill="#FAF9F6"/></g>`;
let pk="";for(let k=0;k<3;k++)pk+=`<g class="pkg"><rect x="-58" y="-58" width="116" height="116" rx="18" fill="${k==1?'#161513':'#C48C34'}"/><text y="22" text-anchor="middle" font-family="Play" font-weight="800" font-size="64" fill="#fff">${k+1}</text></g>`;$("pk").innerHTML=pk;
let ry="";for(let k=0;k<7;k++){const a=-Math.PI+k/6*Math.PI;ry+=`<line x1="${Math.cos(a)*85}" y1="${-10+Math.sin(a)*85}" x2="${Math.cos(a)*115}" y2="${-10+Math.sin(a)*115}"/>`}$("rays").innerHTML=ry;
let bg="";[250,540,830].forEach((x,k)=>bg+=`<g class="bdg" transform="translate(${x+80} 130)"><circle r="28" fill="#C0392B"/><text y="11" text-anchor="middle" font-family="Inter" font-weight="700" font-size="30" fill="#fff">1</text></g>`);document.querySelector("#s5 svg").insertAdjacentHTML("beforeend",bg);

// captions
const CAP=$("cap");let capSeg=-1,spans=[];
function setCap(i){if(capSeg===i)return;capSeg=i;CAP.innerHTML="";spans=[];
 const toks=S[i].text.replace("...","…").split(" ");let wi=0;
 toks.forEach(tok=>{const sp=document.createElement("span");sp.textContent=tok;const c=tok.toLowerCase().replace(/[.,:?…!]/g,"");
  if(HL[i].includes(c))sp.className="hl";sp._t=S[i].wt[Math.min(wi,S[i].wt.length-1)];if(c)wi++;CAP.appendChild(sp);spans.push(sp)});}

const fx=$("fx").getContext("2d");
function particles(t,i){fx.clearRect(0,0,1080,1920);
 // burst at each scene switch: pieces of the illustration scatter and fly into the caption words
 for(let s=1;s<S.length;s++){const lt=t-SC[s];if(lt<0||lt>1.1)continue;
  for(let n=0;n<70;n++){const r1=rnd(s*100+n),r2=rnd(s*100+n+.5),r3=rnd(s*100+n+.9);
   const sx=540+(r1-.5)*520,sy=570+(r2-.5)*300;const tx=160+r3*760,ty=860+rnd(n*7+s)*260;
   const p=eio(lt/1.0);const mx=(sx+tx)/2+(r2-.5)*500,my=Math.min(sy,ty)-180*r1;
   const x=(1-p)*(1-p)*sx+2*(1-p)*p*mx+p*p*tx,y=(1-p)*(1-p)*sy+2*(1-p)*p*my+p*p*ty;
   const a=Math.sin(Math.PI*clamp(lt/1.1))*.9;fx.globalAlpha=a;fx.fillStyle=n%3?"#C48C34":"#161513";
   const sz=4+r1*9;fx.save();fx.translate(x,y);fx.rotate(lt*8*(r2-.5));fx.fillRect(-sz/2,-sz/2,sz,sz*(.4+r3));fx.restore()}}
 fx.globalAlpha=1}

const SCL={s0:0.95,s1:1,s2:1.05,s3:1.15,s4:1.1,s5:1,s6:1.05,s7:1,s8:0.95};
function sceneT(el,lt,dur){ // 3D enter / exit shared by all illustrations
 const ein=eo(lt/0.6), eout=eio((lt-(dur-0.35))/0.45);
 const rx=(1-ein)*-70, rot=eout*85, sc=(0.6+0.4*back(lt/0.7))*(1-0.4*eout);
 el.style.opacity=Math.min(ein,1-eout);
 el.style.filter=`blur(${(1-ein)*14+eout*16}px)`;
 el.style.transform=`translateZ(${(1-ein)*-400}px) rotateX(${rx}deg) rotateY(${rot}deg) scale(${sc*(SCL[el.id]||1)})`;}

function render(t){
 $("b1").style.transform=`translate(${-260+140*Math.sin(t*.35)}px,${120+120*Math.cos(t*.27)}px)`;
 $("b2").style.transform=`translate(${520+120*Math.cos(t*.3)}px,${1150+140*Math.sin(t*.22)}px)`;
 let i=0;for(let k=0;k<SC.length;k++)if(t>=SC[k])i=k;
 const lt=t-SC[i], dur=(i<S.length-1?SC[i+1]:TL.total+5)-SC[i];
 for(let k=0;k<S.length;k++){const el=$("s"+k);if(k!==i){el.style.opacity=0;continue}sceneT(el,lt,i===8?99:dur)}
 $("cam").style.transform=`scale(${1+0.03*clamp(lt/8)})`;
 // chips: 3 coisas during 4..6
 const ch=$("chips");ch.style.opacity=(i>=4&&i<=6)?eo((t-SC[4])/0.4):0;
 [...ch.children].forEach((c,k)=>{const on=i>=4&&k<=i-4;c.className="chip"+(on?" on":"");c.style.transform=`scale(${on&&k===i-4?1+0.25*(1-eo(lt/0.5)):1})`});
 if(i===0){$("ck0").style.strokeDashoffset=60*(1-eo((lt-0.3)/0.4));
  const bq=back((lt-0.1)/0.6);$("bmain").setAttribute("transform",`scale(${Math.max(.001,bq)})`);$("bmain").style.transformOrigin="80px 0px";
  const fg=clamp((lt-2.2)/1.4);$("card0").setAttribute("opacity",1-fg);$("card0").style.filter=`blur(${fg*10}px)`;$("bmain").setAttribute("opacity",1-clamp((lt-3.0)/0.8));
  $("bd1").setAttribute("opacity",1-clamp((lt-3.2)/0.5));$("bd2").setAttribute("opacity",1-clamp((lt-3.0)/0.5));
  let d="";if(fg>0)for(let n=0;n<24;n++){const q=clamp(fg*1.3-rnd(n)*.3);d+=`<circle cx="${480+rnd(n+1)*300+q*80*(rnd(n+2)-.5)}" cy="${80+rnd(n+3)*100+q*q*200}" r="${(1-q)*8+1}" opacity="${(1-q)*(q>0?1:0)}"/>`}$("dots0").innerHTML=d;
  const fl=clamp((lt-1.6)/0.6);$("calp").setAttribute("transform",`translate(0 ${32}) scale(1 ${Math.abs(Math.cos(fl*Math.PI))}) translate(0 -32)`);$("calt").textContent=fl>0.5?"D+1":"D0";$("calt").setAttribute("fill",fl>0.5?"#C48C34":"#161513");}
 if(i===1){$("tl1").style.strokeDashoffset=820*(1-eio(lt/0.7));$("gap1").setAttribute("opacity",eo((lt-1.0)/0.4)*(0.7+0.3*Math.sin(lt*8)));
  [...document.querySelectorAll(".pd")].forEach((c,k)=>{const st=0.4+k*0.12,q=clamp((lt-st)/2.2);const drop=k%4!==0;const dx=400+rnd(k)*260;let x=130+q*820,y=200,o=q>0?1:0;
   if(drop&&x>dx){const f=(x-dx)/120;x=dx+(x-dx)*.35;y=200+f*f*60;o=Math.max(0,1-f*.5)}else if(!drop){y=200-Math.abs(Math.sin(q*18))*18}
   c.setAttribute("cx",x);c.setAttribute("cy",y);c.setAttribute("opacity",o)});
  $("pinB").setAttribute("transform",`translate(950 200) scale(${1+0.15*Math.max(0,Math.sin((lt-2.6)*5))*(lt>2.6&&lt<3.3?1:0)})`);}
