<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Cinzel;src:url(/home/user/Disparo-/videos/ads/a01-campinas/fonts/cinzel-latin.woff2)}
@font-face{font-family:Pf;src:url(/home/user/Disparo-/videos/ads/a01-campinas/fonts/playfair-italic-latin.woff2);font-style:italic}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#070605;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
#st{position:absolute;inset:0}
</style></head><body><div id="st"></div>
<script>
// Fundo de TV · loop de 24 s · render(t) determinístico (sem Math.random, sem relógio)
const D=24,cl=x=>Math.max(0,Math.min(1,x)),eo=x=>1-Math.pow(1-cl(x),3),eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2},
 back=x=>{x=cl(x);const c=1.3;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
let s=7;const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647};
const DUST=[...Array(70)].map(()=>({x:rnd()*1920,y:rnd()*1080,r:.6+rnd()*2.2,sp:.15+rnd()*.5,ph:rnd()*6.28,a:.15+rnd()*.45}));
// funil: 4 etapas (centro x, topo y, largura topo, largura base, altura)
const FX=420,ST=[{n:"PESQUISA",y:200,w1:760,w2:600},{n:"OFERTA",y:360,w1:600,w2:450},{n:"AQUECIMENTO",y:520,w1:450,w2:310},{n:"CARRINHO",y:680,w1:310,w2:180}],SH=140;
const HIT=[2.0,3.6,5.2,6.8],EXIT=8.0;
function ballPos(t){ // bola cai de etapa em etapa com pequeno quique
 const pts=[[0.9,FX+60,40],[HIT[0],FX-20,ST[0].y+70],[HIT[1],FX+25,ST[1].y+70],[HIT[2],FX-15,ST[2].y+70],[HIT[3],FX+10,ST[3].y+70],[EXIT,FX,880]];
 if(t<pts[0][0])return null;
 for(let i=0;i<pts.length-1;i++){const[a,xa,ya]=pts[i],[b,xb,yb]=pts[i+1];if(t>=a&&t<b){const u=(t-a)/(b-a);
  const fall=u*u;const bounce=i>0?Math.sin(cl(u/.18)*Math.PI)*-22*(1-u):0;return{x:xa+(xb-xa)*eio(u),y:ya+(yb-ya)*fall+bounce,v:u}}}
 if(t<EXIT+.5)return{x:FX,y:880+(t-EXIT)*300,v:1,fade:cl((t-EXIT)/.4)};return null}
function render(T){const t=((T%D)+D)%D;const gIn=cl(t/1.0)*(1-cl((t-22.6)/1.2));
 let h=`<div style="position:absolute;inset:0;background:radial-gradient(1100px 800px at 34% 55%,#1a1612,#070605 70%)"></div>`;
 // poeira cinematográfica
 h+=`<svg style="position:absolute;inset:0" width="1920" height="1080">${DUST.map(d=>{const y=(d.y-t*d.sp*20+1080)%1080,x=d.x+Math.sin(t*.3+d.ph)*14;return `<circle cx="${x}" cy="${y}" r="${d.r}" fill="#F5D08F" opacity="${d.a*(.5+.5*Math.sin(t*.8+d.ph))*gIn}"/>`}).join("")}</svg>`;
 // revelação: rosto em degradê à direita
 const R=8.6,rv=eio((t-R)/1.9)*(1-cl((t-22.4)/1.2)),push=1.08-.08*eo((t-R)/6);
 h+=`<div style="position:absolute;right:0;top:0;width:860px;height:1080px;opacity:${rv};transform:scale(${push});transform-origin:70% 45%;background:url(rosto-torre.jpg) right center/auto 1080px no-repeat;-webkit-mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.6) 28%,#000 48%);filter:saturate(.9) contrast(1.05)"></div>`;
 h+=``;
 // funil 3D
 const camX=-20*eio((t-R)/2.2)*(1-cl((t-22.4)/1.2));let f=`<svg style="position:absolute;left:${camX}px;top:0;opacity:${gIn};transform:scale(.86);transform-origin:420px 540px" width="1300" height="1080"><defs>
  <linearGradient id="gOn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9A5F2A"/><stop offset=".5" stop-color="#F5D08F"/><stop offset="1" stop-color="#9A5F2A"/></linearGradient>
  <linearGradient id="gOff" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1b1814"/><stop offset=".5" stop-color="#2c2721"/><stop offset="1" stop-color="#1b1814"/></linearGradient>
  <radialGradient id="ball" cx=".35" cy=".3" r=".7"><stop offset="0" stop-color="#FFF6DE"/><stop offset=".45" stop-color="#F5C46E"/><stop offset="1" stop-color="#8a5523"/></radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter></defs>`;
 ST.forEach((S,i)=>{const on=eo((t-HIT[i])/.45),pulse=Math.exp(-Math.max(0,t-HIT[i])*3)*(t>=HIT[i]?1:0),off=1-cl((t-22.2)/1);const L=on*off;
  const x1=FX-S.w1/2,x2=FX+S.w1/2,b1=FX-S.w2/2,b2=FX+S.w2/2,y=S.y,yb=S.y+SH;
  f+=`<path d="M${x1} ${y} L${x2} ${y} L${b2} ${yb} L${b1} ${yb} Z" fill="url(#gOff)" stroke="#3a332b" stroke-width="2"/>`;
  f+=`<path d="M${x1} ${y} L${x2} ${y} L${b2} ${yb} L${b1} ${yb} Z" fill="url(#gOn)" opacity="${L*.92}"/>`;
  f+=`<ellipse cx="${FX}" cy="${y}" rx="${S.w1/2}" ry="26" fill="#0e0c0a" stroke="${L>.05?'#FFE3A8':'#4a4238'}" stroke-width="${2+2*L}" opacity="${.95}"/>`;
  if(pulse>.01)f+=`<ellipse cx="${FX}" cy="${y+SH/2}" rx="${S.w1/2+60*(1-pulse)}" ry="${70+40*(1-pulse)}" fill="none" stroke="#F5D08F" stroke-width="3" opacity="${pulse*.8*off}"/>`;
  f+=`<ellipse cx="${FX}" cy="${y+SH/2}" rx="${S.w1/2}" ry="70" fill="#F5C46E" opacity="${L*.22}" filter="url(#glow)"/>`;
  f+=`<text x="${FX}" y="${y+SH/2+18}" text-anchor="middle" font-family="Cinzel" font-weight="900" font-size="${42-i*3}" letter-spacing="6" fill="${L>.5?'#1a120a':'#6f665b'}" opacity="${.6+.4*L}">${S.n}</text>`;});
 // saída: cliente decidido
 const cd=eo((t-EXIT-.1)/.5)*(1-cl((t-22.2)/1));f+=`<ellipse cx="${FX}" cy="${905}" rx="${130+40*cd}" ry="22" fill="#F5C46E" opacity="${cd*.35}" filter="url(#glow)"/><text x="${FX}" y="${975}" text-anchor="middle" font-family="Cinzel" font-weight="900" font-size="40" letter-spacing="8" fill="#F5D08F" opacity="${cd}">CLIENTE DECIDIDO</text>`;
 // bola com rastro (motion blur por subamostras)
 for(let k=4;k>=0;k--){const b=ballPos(t-k*.018);if(!b)continue;const a=(k==0?1:.18)*(1-(b.fade||0));f+=`<circle cx="${b.x}" cy="${b.y}" r="22" fill="url(#ball)" opacity="${a}"/>`;if(k==0)f+=`<circle cx="${b.x}" cy="${b.y}" r="40" fill="#F5C46E" opacity="${.25*a}" filter="url(#glow)"/>`}
 f+=`</svg>`;h+=f;
 // logo e nome ao lado do funil
 const lg=eo((t-9.5)/1.3)*(1-cl((t-22.2)/1.2)),nm=cl((t-10.2)/1.2),tg=eo((t-11.6)/.9)*(1-cl((t-22.2)/1.2));
 const name="ESTRATEGISTA";let letters="";for(let i=0;i<name.length;i++){const p=eo((t-10.2-i*.06)/.6)*(1-cl((t-22.2)/1.2));letters+=`<span style="display:inline-block;opacity:${p};filter:blur(${(1-p)*10}px);transform:translateY(${(1-p)*24}px)">${name[i]}</span>`}
 h+=`<div style="position:absolute;left:790px;top:320px;width:520px;text-align:left;white-space:nowrap">
  <div style="opacity:${lg};transform:scale(${.85+.15*back((t-9.5)/1.3)});transform-origin:0 50%;margin-bottom:26px"><svg viewBox="30 0 80 152" style="height:150px;filter:drop-shadow(0 0 ${18+10*Math.sin(t*1.4)}px rgba(232,179,106,.7))"><defs><linearGradient id="o9" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F5D08F"/><stop offset="1" stop-color="#9A5F2A"/></linearGradient></defs><circle cx="70" cy="15" r="5" fill="#F5D08F"/><path d="M40 30H52V48H64V30H76V48H88V30H100V62L90 74L92 122L104 134V146H36V134L48 122L50 74L40 62Z" fill="url(#o9)"/></svg></div>
  <div style="font-family:Cinzel;font-weight:900;font-size:56px;letter-spacing:.1em;color:#F3EDE2;text-shadow:0 0 30px rgba(0,0,0,.8)">${letters}</div>
  <div style="font-family:Pf;font-style:italic;font-size:54px;color:#E8B36A;margin-top:4px;opacity:${eo((t-11.0)/.8)*(1-cl((t-22.2)/1.2))}">de lançamento</div>
  <div style="height:3px;width:${tg*460}px;background:linear-gradient(90deg,#E8B36A,transparent);margin:30px 0 26px"></div>
  <div style="font-size:32px;color:#cfc6b6;letter-spacing:.03em;opacity:${tg}">Você atende. Eu desenho e comando.</div>
  <div style="font-size:26px;color:#8f877c;letter-spacing:.12em;margin-top:18px;opacity:${tg}">ESTRATEGISTADELANCAMENTO.COM.BR</div></div>`;
 // varredura de luz cinematográfica
 const sw=cl((t-9.0)/1.6);if(sw>0&&sw<1)h+=`<div style="position:absolute;top:-200px;bottom:-200px;width:380px;left:${-400+sw*2700}px;background:linear-gradient(90deg,transparent,rgba(255,236,200,.16),transparent);transform:skewX(-18deg)"></div>`;
 const fl=cl(1-Math.abs(t-EXIT-.15)/.35)*.5;h+=`<div style="position:absolute;inset:0;background:radial-gradient(500px 300px at ${FX}px 905px,rgba(255,220,160,${fl}),transparent 70%)"></div>`;
 // vinheta e granulação leve
 h+=`<div style="position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.75))"></div>`;
 document.getElementById('st').innerHTML=h}
render(0);
</script></body></html>
