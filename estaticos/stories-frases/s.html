<!doctype html><html><head><meta charset="utf-8">
<!-- Stories estáticos com frase de efeito (1080x1920). render(i) desenha a frase i sobre a foto de marca.
     Zona livre para sticker entre y 1300 e 1560 (enquete, caixa ou contagem, colocados no app). -->
<style>
@font-face{font-family:Cinzel;src:url(/home/user/Disparo-/videos/ads/a01-campinas/fonts/cinzel-latin.woff2)}
@font-face{font-family:Pf;src:url(/home/user/Disparo-/videos/ads/a01-campinas/fonts/playfair-italic-latin.woff2);font-style:italic}
html,body{margin:0;width:1080px;height:1920px;background:#141210;overflow:hidden;font-family:"Inter Display","Inter",sans-serif}
#bg{position:absolute;inset:0;background-size:cover;background-position:center 30%}
#v{position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,13,11,.55) 0%,rgba(14,13,11,.15) 30%,rgba(14,13,11,.55) 52%,rgba(14,13,11,.94) 70%,rgba(14,13,11,.97) 100%)}
.rot{position:absolute;left:80px;top:250px;font-family:'DejaVu Sans Mono',monospace;font-size:26px;letter-spacing:.14em;color:#d8cfc0}
.fr{position:absolute;left:80px;right:80px;top:1000px;font-family:Pf;font-style:italic;font-size:84px;line-height:1.12;color:#F3EDE2;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.fr b{font-family:Cinzel;font-style:normal;font-weight:900;color:#F5C46E;letter-spacing:.01em}
.fio{position:absolute;left:80px;width:120px;height:4px;background:#E8B36A}
.ass{position:absolute;left:80px;font-size:30px;font-weight:700;color:#cfc6b6;letter-spacing:.04em}
.ass i{font-family:Pf;font-weight:400;color:#F5C46E}
</style></head><body><div id=bg></div><div id=v></div><div id=t></div>
<script>
const F = [
 {foto: 'f1.jpg', rot: 'FRASE DO DIA', fr: 'Você atende.<br>Eu desenho e <b>comando</b> o seu lançamento.', quad: true},
 {foto: 'f2.jpg', rot: 'FRASE DO DIA', fr: 'Fila de espera não é sucesso.<br>É <b>teto</b>.'},
 {foto: 'f3.jpg', rot: 'FRASE DO DIA', fr: 'Lançamento é <b>xadrez</b>.<br>A maioria joga dama.'},
 {foto: 'f4.jpg', rot: 'FRASE DO DIA', fr: 'O lead que não comprou vale mais do que o que <b>comprou</b>.'},
 {foto: 'f5.jpg', rot: 'FRASE DO DIA', fr: 'Nem tudo que vemos é <b>ouro</b>.'},
 {foto: 'f1.jpg', rot: 'HOJE · 21H · NO FEED', fr: 'Um recado para quem tem a <b>agenda cheia</b>.', quad: true},
];
function render(i) {
  const d = F[i]; document.getElementById('bg').style.backgroundImage = `url(${d.foto})`;
  const bg = document.getElementById('bg'); bg.style.backgroundPosition = d.quad ? 'center 120px' : (d.pos || 'center 30%');
  bg.style.backgroundSize = d.quad ? '1180px auto' : 'cover'; bg.style.backgroundRepeat = 'no-repeat';   // foto quadrada: inteira no topo
  const t = document.getElementById('t');
  t.innerHTML = `<div class=rot>${d.rot}</div><div class=fr id=fr>${d.fr}</div>`;
  const fr = document.getElementById('fr'), h = fr.getBoundingClientRect().height, top = 1250 - h;   // a frase termina em y 1250
  fr.style.top = top + 'px';
  t.insertAdjacentHTML('beforeend', `<div class=fio style="top:${top - 40}px"></div><div class=ass style="top:1600px">Bruno · <i>Estrategista de Lançamento</i><br><span style="font-size:26px;color:#a49b8d">@o_estrategista.com.br</span></div>`);
}
</script></body></html>
