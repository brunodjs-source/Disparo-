<!doctype html>
<!-- Fundo virtual do Teams (1920x1080) com a marca. ?tema=claro|escuro  ·  ?logo=1 gera só o logo, com fundo transparente -->
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
@font-face{font-family:Cinzel;src:url(../../videos/ads/a01-campinas/fonts/cinzel-latin.woff2) format("woff2");font-weight:400 700}
@font-face{font-family:Playfair;src:url(../../videos/ads/a01-campinas/fonts/playfair-italic-latin.woff2) format("woff2");font-style:italic}
:root{--fundo:#F6F1E8;--texto:#161513;--sub:#9A5F2A;--site:#7d7366;--brilho:rgba(232,179,106,.26);--sombra:rgba(122,78,24,.10);--bokeh:rgba(196,140,52,.10);--linha:rgba(154,95,42,.45)}
.escuro{--fundo:#141210;--texto:#F3EDE2;--sub:#E8B36A;--site:#a89c8a;--brilho:rgba(196,140,52,.24);--sombra:rgba(122,78,24,.22);--bokeh:rgba(232,179,106,.07);--linha:rgba(232,179,106,.45)}
html,body{margin:0}
body{width:1920px;height:1080px;overflow:hidden;position:relative;background:
 radial-gradient(1300px 900px at 88% 6%,var(--brilho),transparent 62%),
 radial-gradient(1100px 800px at 4% 104%,var(--sombra),transparent 60%),
 linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.04)),var(--fundo)}
.escuro body,body.escuro{background:
 radial-gradient(1300px 900px at 88% 6%,var(--brilho),transparent 62%),
 radial-gradient(1100px 800px at 4% 104%,var(--sombra),transparent 60%),
 radial-gradient(1600px 1000px at 50% 50%,transparent 55%,rgba(0,0,0,.45)),var(--fundo)}
.b{position:absolute;border-radius:50%;background:var(--bokeh);filter:blur(18px)}
.marca{position:absolute;top:104px;right:124px;display:flex;align-items:center;gap:30px}
.marca svg{height:172px;width:auto;filter:drop-shadow(0 6px 14px rgba(154,95,42,.28))}
.nome{font-family:Cinzel,serif;font-weight:500;font-size:46px;letter-spacing:.3em;text-transform:uppercase;color:var(--texto);line-height:1.15;margin-right:-.3em}
.nome small{display:block;font-family:Playfair,serif;font-style:italic;font-weight:400;font-size:42px;letter-spacing:.02em;text-transform:none;color:var(--sub);margin-top:6px}
.linha{height:2px;margin-top:18px;background:linear-gradient(90deg,transparent,var(--linha))}
.site{font-family:Cinzel,serif;font-size:19px;letter-spacing:.24em;text-transform:uppercase;color:var(--site);margin-top:14px;text-align:right;margin-right:-.24em}
body.logo{width:auto;height:auto;background:transparent}
body.logo .marca{position:static;display:inline-flex;padding:24px}
</style></head>
<body>
<div class="b" style="left:120px;top:250px;width:220px;height:220px"></div>
<div class="b" style="left:330px;top:520px;width:120px;height:120px"></div>
<div class="b" style="left:60px;top:700px;width:300px;height:300px"></div>
<div class="b" style="left:470px;top:180px;width:90px;height:90px"></div>
<div class="marca">
 <svg viewBox="30 0 80 152" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A Torre"><defs><linearGradient id="ouro" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8B36A"/><stop offset="1" stop-color="#9A5F2A"/></linearGradient></defs><circle cx="70" cy="15" r="5" fill="#E8B36A"/><path d="M 40 30 L 52 30 L 52 48 L 64 48 L 64 30 L 76 30 L 76 48 L 88 48 L 88 30 L 100 30 L 100 62 L 90 74 L 92 122 L 104 134 L 104 146 L 36 146 L 36 134 L 48 122 L 50 74 L 40 62 Z" fill="url(#ouro)"/></svg>
 <div><div class="nome">Estrategista<small>de lançamento</small></div><div class="linha"></div><div class="site">estrategistadelancamento.com.br</div></div>
</div>
<script>
const q=new URLSearchParams(location.search);
if(q.get("tema")==="escuro")document.body.classList.add("escuro");
if(q.get("logo")){document.body.classList.add("logo");document.querySelectorAll(".b,.linha,.site").forEach(e=>e.remove());}
</script>
</body></html>
